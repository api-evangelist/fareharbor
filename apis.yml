- aid: fareharbor:fareharbor-bookings-endpoints-api
  name: FareHarbor Bookings Endpoints API
  description: >-
    The bookings endpoints in the FareHarbor API provide comprehensive functionalities for managing reservations
    efficiently. These endpoints enable developers and business owners to integrate and automate booking-related
    operations seamlessly into their services. Through these endpoints, users can create, retrieve, update,
    and cancel bookings directly through the API.


    Key functionalities offered by the bookings endpoints include:

    * **Creating Bookings:** Enables the creation of new bookings, allowing customers to reserve spots
    for tours and activities directly through third-party applications.

    * **Retrieving Bookings:** Offers the ability to query and retrieve details of existing bookings,
    providing essential information like booking status, customer details, and payment information.

    * **Updating Bookings:** Supports modifications to existing bookings, which is crucial for managing
    changes in customer plans.

    * **Cancelling Bookings:** Allows for the cancellation of bookings, helping to manage availability
    and customer expectations effectively.


    These endpoints are designed to foster a more connected experience between tour and activity operators
    and their customers by simplifying the booking process through automation and integration. This ensures
    that businesses can focus more on providing an exceptional service experience, while the logistical
    aspects of bookings are handled efficiently through the API.


    **Things to Note:**

    * Orders:
        * Orders are a way of grouping collections of bookings so that they can be created or cancelled
    as a block.
        * A booking can belong to an order, but it doesn't have to. An order can include any number of
    bookings.
        * When `order` is not `null`, `order` is an object that provides the following property:
            * `display_id`: `string`  - A unique identifier for the order.
        * See [Orders](#tag/Orders) to learn more about creating and retrieving orders.
  humanURL: https://developer.fareharbor.com/api/external/v1/
  baseURL: https://fareharbor.com/api/external/v1
