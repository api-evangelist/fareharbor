- aid: fareharbor:fareharbor-crew-members-endpoints-api
  name: FareHarbor Crew Members Endpoints API
  description: >-
    The Crew Members endpoints in the FareHarbor API provide comprehensive functionality for managing
    crew assignments on availabilities. These endpoints allow you to assign, update, and remove crew members
    from specific availability slots, ensuring proper staffing and crew coordination for tours and activities.


    Key functionalities offered by the Crew Members endpoints include:

    * **Listing Crew Members:** Retrieve all crew members currently assigned to a specific availability,
    including their roles and notes.

    * **Adding Crew Members:** Assign users to availabilities as crew members with optional role assignments
    and notes.

    * **Updating Crew Members:** Modify existing crew member assignments, specifically changing roles
    or updating notes.

    * **Removing Crew Members:** Remove crew members from availabilities when they are no longer needed.


    These endpoints are essential for tour operators who need to manage staffing levels, assign specific
    roles to crew members, and maintain clear communication about crew responsibilities through notes
    and role assignments.
