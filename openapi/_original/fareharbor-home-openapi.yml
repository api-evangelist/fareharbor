      type: object
    
    
  
    
    COMPANY_RESPONSE_JSON_SCHEMA:
      $schema: http://json-schema.org/draft-04/schema#
      additionalProperties: false
      definitions:
        address:
          additionalProperties: false
          properties:
            city:
              example: Honolulu
              type: string
            country:
              example: US
              type: string
            postal_code:
              example: '96821'
              type: string
            province:
              example: HI
              type: string
            street:
              example: 123 Wailupe Cir
              type: string
          required:
          - city
          - country
          - postal_code
          - province
          - street
          type: object
        company:
          additionalProperties: false
          properties:
            about:
              description: About page content for the company.
              example: Hawaiian Adventures offers several water activities that you are
                sure to enjoy.
              format: markdown
              type: string
            about_safe_html:
              description: About page content for the company.
              example: <p>Hawaiian Adventures offers several water activities that you
                are sure to enjoy.</p>
              format: markdown
              type: string
            address:
              $ref: '#/components/schemas/COMPANY_RESPONSE_JSON_SCHEMA/definitions/address'
              description: The company's physical address.
            affiliated_since:
              description: "If the API user\u2019s company is an affiliate, then we will\
                \ see a timestamp of when the relationship started (set in utc time)."
              example: 2020-06-17T15:44:03+0000
              format: datetime
              oneOf:
              - description: "If the API user\u2019s company is an affiliate, then we\
                  \ will see a timestamp of when the relationship started (set in utc\
                  \ time)."
                example: 2020-06-17T15:44:03+0000
                format: datetime
                type: string
              - type: 'null'
            billing_address:
              $ref: '#/components/schemas/COMPANY_RESPONSE_JSON_SCHEMA/definitions/address'
              description: The company's billing address.
            booking_notes:
              description: General notes for booking customers.
              example: 'Weather conditions will be evaluated at the time of check-in.
    
    
                -If using a voucher, please bring the voucher with you.'
              format: markdown
              type: string
            booking_notes_safe_html:
              description: General notes for booking customers.
              example: '<p>Weather conditions will be evaluated at the time of check-in.
    
    
                -If using a voucher, please bring the voucher with you.</p>'
              format: markdown
              type: string
            contact_email:
              description: The company's contact email.
              example: info@hawaiianadventures.com
              type: string
            contact_phone:
              description: The company's contact phone.
              example: +1-808-555-1234
              type: string
            currency:
              description: The company's currency.
              enum:
              - aed
              - aud
              - bgn
              - brl
              - cad
