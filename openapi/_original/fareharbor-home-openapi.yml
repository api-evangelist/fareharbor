    MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA:
      $schema: http://json-schema.org/draft-04/schema#
      additionalProperties: false
      definitions:
        availability:
          properties:
            capacity:
              description: The overall maximum number of customers that can currently
                book this availability; this number will change over time as other customers
                book.
              example: 3
              type: number
            crew_members:
              items:
                $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/crew_member'
              type: array
            custom_field_instances:
              items:
                $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/custom_field_instance_summary'
              type: array
            customer_type_rates:
              items:
                $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/customer_type_rate'
              type: array
            effective_booking_cutoff:
              $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/effective_booking_cutoff'
            effective_cancellation_policy:
              $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/effective_cancellation_policy'
            end_at:
              description: The availability's end time (set in the company's local time);
                note that this time can be arbitrarily long or short, and that start_at
                can equal end_at for 'point' availabilities.
              example: 2023-08-18T03:30:00-0600
              format: datetime
              type: string
            headline:
              description: The availability's public headline. Only included when `detailed=yes`.
              example: Epic Jet Ski Tour
              type: string
            maximum_party_size:
              oneOf:
              - example: 1
                type: number
              - type: 'null'
            minimum_party_size:
              oneOf:
              - example: 1
                type: number
              - type: 'null'
            online_booking_status:
              description: The availability's status.
              enum:
              - auto
              - open
              - call
              - closed
              - cancelled
              example: auto
              type: string
            pk:
              description: The availabilities's unique ID.
              example: 50291151
              format: int32
              type: number
            start_at:
              description: The availability's start time (set in the company's local time);
                note that this time can be arbitrarily long or short, and that start_at
                can equal end_at for 'point' availabilities.
              example: 2023-08-18T00:30:00-0600
              format: datetime
              type: string
          required:
          - pk
          - start_at
          - end_at
          - capacity
          - minimum_party_size
          - maximum_party_size
          - online_booking_status
          - customer_type_rates
          type: object
        crew_member:
          additionalProperties: false
          properties:
            note:
              description: A note on the crew member.
              type: string
            pk:
              description: The crew member's unique ID.
              format: int32
              type: number
            role:
              $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/role'
              description: The role of the crew member.
            user:
              $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/user'
              description: The crew member user.
          required:
          - pk
          - note
          - user
          type: object
        custom_field_instance_summary:
          additionalProperties: false
          properties:
            custom_field:
              $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/custom_field_summary'
            pk:
              description: The custom field instance's unique ID.
              example: 2681
              format: int32
              type: number
          required:
          - pk
          - custom_field
          type: object
        custom_field_summary:
          additionalProperties: false
          properties:
            is_priced:
              description: Indicates whether the custom field has pricing configured.
              example: false
              type: boolean
            is_required:
              description: Indicates whether the custom field requires a value.
              example: true
              type: boolean
            modifier_kind:
              description: Determines whether an offset or percentage is used when the
                total is adjusted or set.
              enum:
              - percentage
              - offset
              example: percentage
              type: string
            modifier_type:
              description: Determines whether the total is adjusted or set.
              enum:
              - adjust
              - set
              - none
              example: adjust
              type: string
            name:
              description: The name of the custom field.
              example: Weight
              type: string
            offset:
              description: 'When modifier_type is adjust: a positive or negative amount
                value. When modifier_type is set: a positive amount value. Only applicable
                when modifier_kind is offset.'
              type: number
            percentage:
              description: 'When modifier_type is adjust: a number between -100 and 100
                inclusive. When modifier_type is set: a number between 0 and 100 inclusive.
                Only applicable when modifier_kind is percentage.'
              example: 35
              type: number
            pk:
              description: The custom field's unique ID.
              example: 4502
              format: int32
              type: number
            total:
              description: The absolute price of a single custom field of this type when
                modifier_kind is offset. May be 0 for percentage pricing until applied
                to a base amount.
              example: 20000
              type: number
            type:
              description: The custom field's type.
              example: short
              type: string
          required:
          - pk
          - name
          - type
          - is_required
          - is_priced
          - modifier_kind
          - modifier_type
          - offset
          - percentage
          - total
          type: object
        customer_prototype:
          additionalProperties: false
          properties:
            display_name:
              description: The customer prototype's display name.
              example: Adult
              type: string
            maximum_age:
              oneOf:
              - description: The maximum age for this customer type (inclusive).
                example: 64
                type: number
              - type: 'null'
            minimum_age:
              oneOf:
              - description: The minimum age for this customer type (inclusive).
                example: 18
                type: number
              - type: 'null'
            note:
              type: string
            pk:
              description: The customer prototype's unique ID.
              example: 2522
              format: int32
              type: number
            total:
              description: The price of a single customer of this type.
              example: 20000
              type: number
            total_including_tax:
              description: The price of a single customer of this type plus applicable
                taxes.
              example: 21550
              type: number
          required:
          - pk
          - display_name
          - note
          - minimum_age
          - maximum_age
          - total
          type: object
        customer_type:
          additionalProperties: false
          properties:
            note:
              description: A brief note about this customer type that can be displayed
                to end users.
              example: At least 18 years old.
              type: string
            pk:
              description: The customer type's unique ID.
              example: 589
              format: int32
              type: number
            plural:
              description: The plural form of the name of this customer type.
              example: Adults
              type: string
            singular:
              description: The singular form of the name of this customer type.
              example: Adult
              type: string
          required:
          - pk
          - singular
          - plural
          - note
          type: object
        customer_type_rate:
          additionalProperties: false
          properties:
            capacity:
              oneOf:
              - description: The maximum number of customers of this type that can currently
                  book this availability; this number will change over time as other customers
                  book.
                example: 10
                type: number
              - type: 'null'
            custom_field_instances:
              items:
                $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/custom_field_instance_summary'
              type: array
            customer_prototype:
              $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/customer_prototype'
            customer_type:
              $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/customer_type'
            maximum_party_size:
              oneOf:
              - type: number
              - type: 'null'
            minimum_party_size:
              oneOf:
              - type: number
              - type: 'null'
            pk:
              description: The customer type rate's unique ID.
              example: 978
              format: int32
              type: number
          required:
          - pk
          - capacity
          - minimum_party_size
          - maximum_party_size
          - customer_type
          - customer_prototype
          type: object
        cutoff_time:
          oneOf:
          - description: The cutoff time (in company's local time).
            example: 2024-04-16T00:00:00-1000
            format: datetime
            type: string
          - type: 'null'
        effective_booking_cutoff:
          additionalProperties: false
          properties:
            cutoff:
              $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/cutoff_time'
          required:
          - cutoff
          type: object
        effective_cancellation_policy:
          additionalProperties: false
          properties:
            cutoff:
              $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/cutoff_time'
            type:
              description: The cancellation policy's type
              enum:
              - hours-before-start
              - hours-before-midnight
              - always
              - never
              example: hours-before-start
              type: string
          required:
          - type
          - cutoff
          type: object
        role:
          additionalProperties: false
          properties:
            pk:
              description: The role's unique ID.
              format: int32
              type: number
            short_name:
              description: The roles's short name.
              type: string
          required:
          - pk
          - short_name
          type: object
        user:
          additionalProperties: false
          properties:
            name:
              description: The name of the user.
              type: string
            username:
              description: The username of the user.
              type: string
          required:
          - name
          - username
          type: object
      properties:
        availabilities:
          items:
            $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/availability'
          type: array
      required:
      - availabilities
      type: object
    
    
  
    
    ROLES_RESPONSE_JSON_SCHEMA:
      $schema: http://json-schema.org/draft-04/schema#
      additionalProperties: false
      definitions:
        role:
          additionalProperties: false
          description: A specific position or responsibility that can be assigned to crew
            members.
          properties:
