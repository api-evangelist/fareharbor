        responses:
          '200':
            description: |
              
              Returns a list of items as for which you have permission to create bookings; again, note that this may include items that have no bookable availabilities.
              
              Returns an array of `Item` objects.
              
              When `require_future_availabilities` = yes is specified, only `Item` objects with bookable future availabilities are returned.
              
            content:
              application/json:
                schema:
                
                  $ref: "#/components/schemas/ITEMS_RESPONSE_JSON_SCHEMA"
                
          '400':
            $ref: "#/components/responses/BadRequest"
          '403':
            $ref: "#/components/responses/Forbidden"
          '404':
            $ref: "#/components/responses/NotFound"
          '429':
            $ref: "#/components/responses/TooManyRequests"
          '504':
            $ref: "#/components/responses/GatewayTimeout"
        description: |
          
          The `/items` endpoint shows every bookable product (referred to as “items” in FareHarbor) on a specified supplier dashboard along with a summary of fields associated with each product. This endpoint includes product photos, locations, booking notes, and ticket options. 
          
          **Things to note:**
          * API Partners use this endpoint to import product details and content so that they can build out the appropriate listing on their platform, taking an item’s specific PK (its unique ID) to connect it to the listing.
          * If an item is not displayed through this endpoint, it might mean that it has been discontinued, replaced by another item on the list, or made private or inactive by the supplier.
          * Routine calls to this endpoint are recommended to pull the most up to date list of items for an active supplier. If an item PK is no longer listed, it can be removed from future /availabilities/ requests to avoid ongoing errors for items that have been restricted. 
          * Using the `optimized` query parameter, affiliates can retrieve just basic information like name, location, and tags for all the items offered by their partner companies; then using the [Item endpoint](#tag/Items-Endpoints/operation/get-item) they can get full information for only the items they're interested in.
          
          To get additional information such as `effective_cancellation_policy` in the response, add the query parameter `?detailed=yes` to the end of the URL. Note that `effective_booking_cutoff` is not included in item responses; use the [Availabilities endpoints](#tag/Availabilities-Endpoints) with `?detailed=yes` to retrieve the booking cutoff for each availability.
          
        
    
  

  
    
    

    /companies/<shortname>/items/<item.pk>/:
    
      get:
        summary:  Item
        operationId: get-item
        deprecated: False
        
        tags:
          
          - Items Endpoints
          
        
        parameters:
          - $ref: '#/components/parameters/X-FareHarbor-API-App'
          - $ref: '#/components/parameters/X-FareHarbor-API-User'
          
          - schema:
              type: string
              
              
              example: |
                hawaiianadventures
              
            name: shortname
            in: path
            required: True
            description: |
              
              A unique FareHarbor name assigned to each company when their Dashboard is created, used to access the company's specific information.
              
          
          - schema:
              type: integer
              
              
              example: |
                1867
              
            name: item.pk
            in: path
            required: True
            description: |
              
              The unique numerical ID of the bookable product (referred to as `item` in FareHarbor).
              
          
          - schema:
              type: string
              
              
              example: |
                [yes|no]
              
            name: detailed
            in: query
            required: False
            description: |
              
              Include additional item details
              
          
        responses:
          '200':
            description: |
              
              Returns a detailed `Item` object.
              
            content:
              application/json:
                schema:
                
                  $ref: "#/components/schemas/ITEM_RESPONSE_JSON_SCHEMA"
                
          '400':
            $ref: "#/components/responses/BadRequest"
          '403':
            $ref: "#/components/responses/Forbidden"
          '404':
            $ref: "#/components/responses/NotFound"
          '429':
            $ref: "#/components/responses/TooManyRequests"
          '504':
            $ref: "#/components/responses/GatewayTimeout"
