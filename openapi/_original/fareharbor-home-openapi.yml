              type:
              - string
              - 'null'
            itinerary:
              description: Detailed agenda of what the customer can expect.
              example: '<ol>
    
                <li>Safety lesson</li>
    
                <li>White water rafting</li>
    
                <li>Lunch break</li>
    
                <li>Nature hike</li>
    
                </ol>'
              format: markdown
              type:
              - string
              - 'null'
            max_age:
              description: Maximum age restriction.
              example: 65
              type:
              - number
              - 'null'
            meeting_point:
              description: Freeform text describing address, city or landkmark of where
                to meet.
              example: 123 Fake Street, Fakertown CA in front of the statue.
              type:
              - string
              - 'null'
            min_age:
              description: Minimum age restriction.
              example: 5
              type:
              - number
              - 'null'
            pricing:
              description: Overview of prices and options offered.
              example: '<p>Adult $20<br>
    
                Child $10<br>
    
                Children under 5 Free</p>'
              format: markdown
              type:
              - string
              - 'null'
            restrictions:
              description: Any restrictions that cannot be accommodated.
              example: Must be at least 48in tall.
              format: markdown
              type:
              - string
              - 'null'
            short_description:
              description: A concise summary describing the activity.
              example: White water rafting.
              type:
              - string
              - 'null'
            special_requirements:
              description: Any requirements that should be known before booking.
              example: Children under the age of 16 must be accompanied by an adult.
              format: markdown
              type:
              - string
              - 'null'
            what_is_included:
              description: What is included in the price of the activity.
              example: '<ul>
    
                <li>Water</li>
    
                <li>Snacks</li>
    
                </ul>'
              format: markdown
              type:
              - string
              - 'null'
            what_is_included_items:
              description: List of items that are included in the price of the activity.
              items:
                $ref: '#/components/schemas/ITEMS_RESPONSE_JSON_SCHEMA/definitions/what_is_included_item'
              type: array
            what_is_not_included:
              description: What is not included in the price of the activity.
              example: '<ul>
    
                <li>Towels</li>
    
                <li>Wetsuit rentals</li>
    
                </ul>'
              format: markdown
              type:
              - string
              - 'null'
            what_is_not_included_items:
              description: List of items that are not included in the price of the activity.
              items:
                $ref: '#/components/schemas/ITEMS_RESPONSE_JSON_SCHEMA/definitions/what_is_not_included_item'
              type: array
            what_to_bring:
              description: Any items the customer should bring.
              example: '<ul>
    
                <li>Swimsuit</li>
    
                <li>Towel</li>
    
                </ul>'
              format: markdown
              type:
              - string
              - 'null'
            what_to_bring_items:
              description: List of items that the customer should bring.
              items:
                $ref: '#/components/schemas/ITEMS_RESPONSE_JSON_SCHEMA/definitions/what_to_bring_item'
              type: array
          type: object
        tag:
          additionalProperties: false
