components:
  securitySchemes: {}
  parameters:
    X-FareHarbor-API-App:
      name: X-FareHarbor-API-App
      in: header
      required: true
      schema:
        type: string
      description: APP-KEY (Please log in to see your key)
      example: APP-KEY
    X-FareHarbor-API-User:
      name: X-FareHarbor-API-User
      in: header
      required: true
      schema:
        type: string
      description: USER-KEY (Please log in to see your key)
      example: USER-KEY
  responses:
    BadRequest:
      description: "Bad Request (see [Error Codes](#tag/Error-Codes))"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error400"
    Forbidden:
      description: "Forbidden (see [Error Codes](#tag/Error-Codes))"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error403"
    NotFound:
      description: "The specified resource was not found (see [Error Codes](#tag/Error-Codes))"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error404"
    TooManyRequests:
      description: "Too Many Requests (see [Rate Limits](#tag/Getting-Started/Rate-Limits))"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    GatewayTimeout:
      description: "[Gateway Timeout](#tag/Getting-Started/Timeouts)"
  schemas:
  
    
    UPDATE_CREW_MEMBER_REQUEST_JSON_SCHEMA:
      $schema: http://json-schema.org/draft-04/schema#
      additionalProperties: false
      description: JSON body for updating an existing crew member assignment on an availability.
      properties:
        note:
          description: Optional note providing additional context, instructions, or information
            about the crew member's assignment.
          example: 'Updated: Now responsible for safety briefing and equipment check'
          type: string
        role:
          description: Optional short name of the role to assign to the crew member. Must
            match an existing role short_name for the company. Pass null to remove the
            role assignment.
          example: captain
          type:
          - string
          - 'null'
      title: Update Crew Member Request
      type: object
    
    
  
    
    CHECKIN_QR_CODE_REQUEST_JSON_SCHEMA:
      $schema: http://json-schema.org/draft-04/schema#
      additionalProperties: false
      properties:
        checkin_status:
          oneOf:
          - description: the string 'auto' indicates that checkin status should be automatically
              determined. The string 'unchanged' will leave the checkin status unchanged.
              Other string values may be supported in the future. When a checkin status
              pk is provided, the associated checkin status will be used. When null is
              provided, the checkin status will be reset. Defaults to 'auto' if the property
              is not provided.
            example: auto
            type: string
          - type: number
          - type: 'null'
        is_whole_booking:
          description: Whether whole booking checkin is desired. If true, the checkin
            status for all customers associated with the booking will be updated. If false,
            the checkin status for the customer associated with the QR code (customer
            checkin URL) will be updated. Defaults to false if the property is not provided.
          type: boolean
        qr_code:
          description: the customer's QR code data.
          example: https://fhchk.co/abc
          format: uri
          type: string
      required:
      - qr_code
      - is_whole_booking
      type: object
    
    
  
    
    CREATE_CREW_MEMBER_REQUEST_JSON_SCHEMA:
      $schema: http://json-schema.org/draft-04/schema#
      additionalProperties: false
      description: JSON body for creating a crew member assignment on an availability.
      properties:
        note:
          description: Optional note providing additional context, instructions, or information
            about the crew member's assignment.
          example: Responsible for safety briefing and equipment check
          type: string
        role:
          description: Optional short name of the role to assign to the crew member. Must
            match an existing role short_name for the company.
          example: captain
          type: string
        username:
          description: Username of the user to add as a crew member. Must be a valid username
            within the system.
          example: jsmith
          type: string
      required:
      - username
      title: Create Crew Member Request
      type: object
    
    
  
    
    CREATE_LINE_ITEM_REQUEST_JSON_SCHEMA:
      $schema: http://json-schema.org/draft-04/schema#
      additionalProperties: false
      description: JSON body for creating a line item on a booking.
      properties:
        description:
          description: Description of the line item.
          example: Processing fee
          type: string
        discount_code_pk:
          description: Optional discount code ID to apply to this line item.
          example: 1
          type: integer
        is_private:
          default: false
          description: If true, do not show this line item to the customer.
          type: boolean
        is_taxable:
          default: false
          description: Whether the line item is taxable.
          type: boolean
        offset:
          description: Amount in the smallest currency unit (e.g. cents). Use positive
            for fees, negative for discounts (e.g. 1000 for $10.00, -500 for $5.00 discount).
          example: 1000
          type: integer
      required:
      - description
      - offset
      title: Create Line Item Request
      type: object
    
    
  
    
    RESEND_CONFIRMATION_EMAIL_REQUEST_JSON_SCHEMA:
      $schema: http://json-schema.org/draft-04/schema#
      additionalProperties: false
      description: JSON body for queueing confirmation email resends by customer email
        and activity date range.
      properties:
        date_from:
          description: Inclusive activity start date in YYYY-MM-DD format.
          example: '2026-08-01'
          type: string
        date_to:
          description: Inclusive activity end date in YYYY-MM-DD format. The range cannot
            exceed 31 days.
          example: '2026-08-31'
          type: string
        email:
          description: Customer contact email matched case-insensitively.
          example: customer@example.com
          format: email
          type: string
      required:
      - email
      - date_from
      - date_to
      title: Resend Confirmation Email Request
      type: object
    
    
  
    
    RESOURCE_USE_REQUEST_JSON_SCHEMA:
      $schema: http://json-schema.org/draft-04/schema#
      additionalProperties: false
      description: JSON body for updating an existing resource use on a booking.
      properties:
        resource_pk:
          description: The pk of the resource to assign to the resource use.
          example: 12345
          type: integer
      required:
      - resource_pk
      title: Update Resource Use Request
      type: object
    
    
  
    
    CUSTOMER_CUSTOM_FIELD_VALUE_REQUEST_JSON_SCHEMA:
      $schema: http://json-schema.org/draft-04/schema#
      additionalProperties: false
      description: JSON body for updating an existing customer custom field value on a
        booking.
      properties:
        value:
          description: The new value for the customer custom field value.
          example: '10:01'
          type:
          - string
          - number
          - integer
          - boolean
          - 'null'
      required:
      - value
      title: Update Customer Custom Field Value Request
      type: object
    
    
  
    
    CHECKIN_BOOKING_REQUEST_JSON_SCHEMA:
      $schema: http://json-schema.org/draft-04/schema#
      additionalProperties: false
      properties:
        checkin_status:
          oneOf:
          - description: the string 'auto' indicates that checkin status should be automatically
              determined. The string 'unchanged' will leave the checkin status unchanged.
              Other string values may be supported in the future. When a checkin status
              pk is provided, the associated checkin status will be used. When null is
              provided, the checkin status will be reset. Defaults to 'auto' if the property
              is not provided.
            example: auto
            type: string
          - type: number
          - type: 'null'
        customer:
          oneOf:
          - description: when a customer pk is specified, the associated customer will
              be checked in. When null is specified, all customers associated with the
              booking will be checked in. Defaults to null if the property is not provided.
            example: 2481
            type: number
          - type: 'null'
      type: object
    
    
  
    
    BOOKING_NOTE_REQUEST_JSON_SCHEMA:
      $schema: http://json-schema.org/draft-04/schema#
      properties:
        note:
          example: This is a *note*.
          type: string
      required:
      - note
      type: object
    
    
  
    
    VALIDATE_REQUEST_JSON_SCHEMA:
      $schema: http://json-schema.org/draft-04/schema#
      additionalProperties: false
      definitions:
        contact:
          additionalProperties: false
          properties:
            email:
              description: The contact email for the party.
              example: surfer@dude.com
              format: email
              type: string
            name:
              description: The name of the head of the party.
              example: Surfer Dude
              type: string
            phone:
              description: The contact phone number for the party.
              example: +1-443-222-1100
              type: string
          required:
          - email
          - name
          - phone
          type: object
        custom_field_value:
          properties:
            custom_field:
              description: A valid Custom Field pk.
              example: 4502
              format: int32
              type: number
            value:
              description: A string up to 2048 characters. If the custom field is of type
                yes-no, 'true' or 'false' must be specified. If the custom field is of
                type extended-option, an extended option pk must be specified.
              example: 'false'
              maxLength: 2048
              type: string
          type: object
        custom_field_values:
          items:
            $ref: '#/components/schemas/VALIDATE_REQUEST_JSON_SCHEMA/definitions/custom_field_value'
          type: array
        customer:
          additionalProperties: false
          properties:
            customer_type_rate:
              description: The customer type rate's unique ID.
              example: 978
              format: int32
              type: number
          required:
          - customer_type_rate
          type: object
        customers:
          items:
            $ref: '#/components/schemas/VALIDATE_REQUEST_JSON_SCHEMA/definitions/customer'
          type: array
      properties:
        contact:
          $ref: '#/components/schemas/VALIDATE_REQUEST_JSON_SCHEMA/definitions/contact'
        custom_field_values:
          $ref: '#/components/schemas/VALIDATE_REQUEST_JSON_SCHEMA/definitions/custom_field_values'
        customers:
          $ref: '#/components/schemas/VALIDATE_REQUEST_JSON_SCHEMA/definitions/customers'
        external_id:
          example: ''
          type: string
        note:
          example: Optional booking note.
          type: string
        voucher_number:
          example: V-35791209
          type: string
      required:
      - contact
      - customers
      type: object
    
    
  
    
    BOOK_REQUEST_JSON_SCHEMA:
      $schema: http://json-schema.org/draft-04/schema#
      additionalProperties: false
      definitions:
        custom_field_value:
          additionalProperties: false
          properties:
            custom_field:
              description: A valid Custom Field pk.
              example: 4502
              format: int32
              type: number
            value:
              oneOf:
              - description: A string up to 2048 characters.
                example: 'false'
                maxLength: 2048
                type: string
              - description: If the custom field is of type yes-no, 'true' or 'false'
                  must be specified
                example: false
                type: boolean
              - description: If the custom field is of type extended-option, an extended
                  option pk must be specified.
                type: number
          required:
          - custom_field
          - value
          type: object
        customer:
          additionalProperties: false
          properties:
            custom_field_values:
              items:
                $ref: '#/components/schemas/BOOK_REQUEST_JSON_SCHEMA/definitions/custom_field_value'
              type: array
            customer_type_rate:
              description: The customer type rate's unique ID.
              example: 978
              format: int32
              type: number
          required:
          - customer_type_rate
          type: object
      properties:
        agent:
          description: The agent's unique ID.
          example: 2314
          format: int32
          type: number
        agent_name:
          description: The agent's name.
          example: Eddie
          maxLength: 128
          type: string
        amount_paid:
          description: 'The payment amount collected by the affiliate user. The amount
            must be an integer number of the smallest negotiable unit of money in the
            company''s currency. In the case of USD, this means USD cents. So, for instance,
            1425 means $14.25 USD. Note: Partial payments are disallowed for rebookings.'
          oneOf:
          - description: ' When amount_paid is 0, no payment will be created. When amount_paid
              is lower than the booking total, a partial payment will be created. Note
              that amount_paid cannot exceed the booking total.'
            example: 1425
            type: number
          - description: When amount_paid is null, a full payment will be created.
            type: 'null'
        contact:
          additionalProperties: false
          properties:
            email:
              description: The contact email for the party.
              example: surfer@dude.com
              format: email
              type: string
            name:
              description: The name of the head of the party.
              example: Surfer Dude
              type: string
            phone:
              description: The contact phone number for the party.
              example: +1-443-222-1100
              type: string
          required:
          - email
          - name
          - phone
          type: object
        custom_field_values:
          items:
            $ref: '#/components/schemas/BOOK_REQUEST_JSON_SCHEMA/definitions/custom_field_value'
          type: array
        customers:
          items:
            $ref: '#/components/schemas/BOOK_REQUEST_JSON_SCHEMA/definitions/customer'
          minItems: 1
          type: array
        desk:
          description: The desk's unique ID.
          example: 2314
          format: int32
          type: number
        desk_name:
          description: The desk's name.
          example: Windward Side
          maxLength: 128
          type: string
        external_id:
          example: ''
          maxLength: 128
          type: string
        lodging:
          description: The lodging's unique ID.
          example: 2314
          format: int32
          type: number
        note:
          example: ''
          maxLength: 10000
          type: string
        orderize_booking:
          example: d75102be-9732-4523-90a8-c698eff2b983
          format: uuid
          maxLength: 36
          type: string
        rebooking:
          description: See [Rebooking](#tag/Rebooking)
          example: d75102be-9732-4523-90a8-c698eff2b983
          format: uuid
          maxLength: 36
          type: string
        voucher_number:
          description: The external booking reference number.
          example: V-35791209
          maxLength: 128
          type: string
      required:
      - contact
      - customers
      type: object
    
    
  
  
    
    BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA:
      $schema: http://json-schema.org/draft-04/schema#
      additionalProperties: false
      definitions:
        address:
          additionalProperties: false
          properties:
            city:
              example: Honolulu
              type: string
            country:
              example: US
              type: string
            postal_code:
              example: '96821'
              type: string
            province:
              example: HI
              type: string
            street:
              example: 123 Wailupe Cir
              type: string
          required:
          - city
          - country
          - postal_code
          - province
          - street
          type: object
        affiliate_company:
          oneOf:
          - additionalProperties: false
            properties:
              currency:
                description: The company's currency.
                enum:
                - aed
                - aud
                - bgn
                - brl
                - cad
                - chf
                - czk
                - dkk
                - eur
                - gbp
                - hkd
                - huf
                - mxn
                - nok
                - nzd
                - pln
                - ron
                - sek
                - sgd
                - usd
                example: usd
                type: string
              name:
                description: The affiliate companies name.
                example: Affiliate Company
                type: string
              shortname:
                description: A unique FareHarbor name assigned to each company when their
                  Dashboard is created, used to access the company's specific information.
                example: affiliate_company
                type: string
            required:
            - shortname
            - name
            - currency
            type: object
          - type: 'null'
        affiliate_metadata:
          description: Metadata from affiliate sources.
          properties:
            airbnb:
              $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/airbnb_metadata'
          type: object
        affiliation:
          additionalProperties: false
          properties:
            affiliate_company:
              $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/affiliate_company'
          required:
          - affiliate_company
          type: object
        agent:
          oneOf:
          - additionalProperties: false
            properties:
              name:
                description: The agent's name.
                example: Eddie
                type: string
              pk:
                description: The agent's unique ID.
                example: 2314
                format: int32
                type: number
            required:
            - pk
            - name
            type: object
          - type: 'null'
        airbnb_guest_profile:
          description: An Airbnb guest profile.
          properties:
            direct_thread_id:
              description: The direct thread ID for the guest.
              example: '2164961599'
              type:
              - string
              - 'null'
            user_id:
              description: The Airbnb user ID.
              example: '17780410'
              type:
              - string
              - 'null'
          type: object
        airbnb_metadata:
          description: Metadata from Airbnb bookings.
          properties:
            activity_id:
              description: The Airbnb activity ID.
              example: '6137649'
              type:
              - string
              - 'null'
            channel_thread_id:
              description: The Airbnb channel thread ID.
              example: '2199079188'
              type:
              - string
              - 'null'
            guest_id:
              description: The Airbnb guest ID.
              example: '17780410'
              type:
              - string
              - 'null'
            guest_profiles:
              description: List of Airbnb guest profiles.
              items:
                $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/airbnb_guest_profile'
              type:
              - array
              - 'null'
            host_id:
              description: The Airbnb host ID.
              example: '1234'
              type:
              - string
              - 'null'
            offering_id:
              description: The Airbnb offering ID.
              example: '5495433'
              type:
              - string
              - 'null'
          type: object
        arrival:
          oneOf:
          - additionalProperties: false
            properties:
              display_text:
                example: Please arrive by 11:45 pm
                type: string
              notes:
                format: markdown
                type: string
              notes_safe_html:
                format: markdown
                type: string
              time:
                description: The arrival time (set in the company's local time); the customer
                  must provide their own transporation and arrive at the activity location
                  by this time.
                example: 2024-04-11T23:45:00-1000
                format: datetime
                type: string
            required:
            - time
            - notes
            - notes_safe_html
            - display_text
            type: object
          - type: 'null'
        availability:
          additionalProperties: false
          properties:
            capacity:
              description: The overall maximum number of customers that can currently
                book this availability; this number will change over time as other customers
                book.
              example: 3
              type: number
            crew_members:
              items:
                $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/crew_member'
              type: array
            custom_field_instances:
              items:
                $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/custom_field_instance'
              type: array
            customer_type_rates:
              items:
                $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/customer_type_rate'
              type: array
            effective_cancellation_policy:
              $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/effective_cancellation_policy'
            end_at:
              description: The availability's end time (set in the company's local time);
                note that this time can be arbitrarily long or short, and that start_at
                can equal end_at for 'point' availabilities.
              example: 2023-08-18T03:30:00-0600
              format: datetime
              type: string
            headline:
              description: The availability's headline.
              example: Epic Jet Ski Tour
              type: string
            item:
              $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/item'
            maximum_party_size:
              oneOf:
              - example: 1
                type: number
              - type: 'null'
            minimum_party_size:
              oneOf:
              - example: 1
                type: number
              - type: 'null'
            online_booking_status:
              description: The availability's status.
              enum:
              - auto
              - open
              - call
              - closed
              - cancelled
              example: auto
              type: string
            pk:
              description: The availabilities's unique ID.
              example: 50291151
              format: int32
              type: number
            start_at:
              description: The availability's start time (set in the company's local time);
                note that this time can be arbitrarily long or short, and that start_at
                can equal end_at for 'point' availabilities.
              example: 2023-08-18T00:30:00-0600
              format: datetime
              type: string
          required:
          - pk
          - start_at
          - end_at
          - capacity
          - minimum_party_size
          - maximum_party_size
          - online_booking_status
          - headline
          - item
          - customer_type_rates
          - custom_field_instances
          type: object
        booking:
          additionalProperties: false
          properties:
            affiliate_company:
              $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/affiliate_company'
            affiliate_metadata:
              $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/affiliate_metadata'
            agent:
              $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/agent'
            amount_paid:
              oneOf:
              - type: number
              - type: 'null'
            amount_paid_display:
              oneOf:
              - example: '0.0'
                type: string
              - type: 'null'
            arrival:
              $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/arrival'
            availability:
              $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/availability'
              description: The availability to which this booking corresponds.
            booked_by:
              oneOf:
              - type: 'null'
              - additionalProperties: false
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
            company:
              $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/company'
            confirmation_url:
              description: The booking's confirmation page URL.
              format: uri
              type: string
            contact:
              $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/contact'
              description: Contact information for this booking.
            created_at:
              description: The date and time at which the booking was created (set in
                utc time).
              example: 2024-06-20T17:14:33+0000
              format: datetime
              type: string
            custom_field_values:
              items:
                $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/custom_field_value'
              type: array
            customer_count:
              description: The number of customers on this booking.
              example: 1
              type: number
            customers:
              description: A list of customers on this booking.
              items:
                $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/customer'
              type: array
            dashboard_url:
              description: The booking's dashboard URL.
              example: https://fareharbor.com/hawaiianadventures/dashboard/?overlay=/contacts/7/bookings/d75102be-9732-4523-90a8-c698eff2b983/
              format: uri
              type: string
            desk:
              $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/desk'
            display_id:
              example: '#6876876'
              type: string
            effective_cancellation_policy:
              $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/effective_cancellation_policy'
            external_id:
              description: An additional identifier if necessary.
              maxLength: 128
              type: string
            generated_codes:
              items:
                $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/generated_code'
              type: array
            invoice_price:
              oneOf:
              - description: The invoice price of this booking. Assuming that the user
                  of the API is a reseller this will be the amount that the user of the
                  API owes the vendor on this booking, if the vendor has opted to set
                  up that information; otherwise it will be null.
                type: number
              - type: 'null'
            invoice_price_display:
              oneOf:
              - type: string
              - type: 'null'
            is_eligible_for_cancellation:
              example: true
              type: boolean
            is_follow_up_email_disabled:
              type: boolean
            is_reminder_email_disabled:
              type: boolean
            is_subscribed_for_sms_updates:
              description: Whether or not the contact would like the booking company to
                send them SMS updates about this booking. Note that the value of this
                field does not reflect whether or not the user has sent a STOP request
                to FareHarbor. If the user sends a STOP request to an External API client,
                that API client should respect that request.
              example: false
              type: boolean
            line_items:
              description: Line items on the booking.
              items:
                $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/line_item'
              type: array
            lodging:
              oneOf:
              - additionalProperties: false
                properties:
                  name:
                    description: The lodging's name.
                    example: Eddie
                    type: string
                  pk:
                    description: The lodging's unique ID.
                    example: 2314
                    format: int32
                    type: number
                required:
                - pk
                - name
                type: object
              - description: ''
                type: 'null'
            note:
              example: ''
              format: markdown
              type: string
            note_safe_html:
              example: ''
              format: markdown
              type: string
            online_booking_references:
              example: ''
              type: string
            order:
              description: When there is no order associated with the booking, order will
                be null.
              oneOf:
              - properties:
                  display_id:
                    description: A unique identifier for the order
                    example: ABTT
                    type: string
                type: object
              - description: ''
                type: 'null'
            payments:
              description: Payment information for the booking, only visible through webhooks
                or with the with_payments=yes query string. If there is no query string,
                then the payments won't show.
              items:
                $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/payment'
              type: array
            pickup:
              $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/pickup'
            pk:
              description: The booking's unique ID.
              example: 6876876
              format: int32
              type: number
            rebooked_from:
              example: null
              oneOf:
              - type: string
              - type: 'null'
            rebooked_to:
              example: null
              oneOf:
              - type: string
              - type: 'null'
            receipt_subtotal:
              oneOf:
              - example: 36000
                type: number
              - type: 'null'
            receipt_subtotal_display:
              oneOf:
              - example: '360.00'
                type: string
              - type: 'null'
            receipt_taxes:
              oneOf:
              - example: 2776
                type: number
              - type: 'null'
            receipt_taxes_display:
              oneOf:
              - example: '27.76'
                type: string
              - type: 'null'
            receipt_total:
              oneOf:
              - example: 38776
                type: number
              - type: 'null'
            receipt_total_display:
              oneOf:
              - example: '387.76'
                type: string
              - type: 'null'
            related_bookings:
              properties:
                related_order:
                  properties:
                    bookings:
                      description: Booking UUIDs related to the order
                      example:
                      - d75102be-9732-4523-90a8-c698eff2b983
                      - a99e711d-2c70-48ce-87ff-0818942c3489
                      items:
                        type: string
                      type: array
                    id:
                      description: Order ID
                      example: ABTT
                      type: string
                  type: object
              type: object
            source_type:
              enum:
              - online
              - direct
              - pos
              - reseller
              - external-api
              - kiosk
              - imported
              - unkown
              example: online
              type: string
            status:
              enum:
              - booked
              - cancelled
              - rebooked
              example: booked
              type: string
            uuid:
              description: The booking's universally unique identifier; used to access
                the booking via the API.
              example: d75102be-9732-4523-90a8-c698eff2b983
              format: uuid
              type: string
            voucher_number:
              example: ''
              type: string
            waiver_signatures:
              $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/waiver_signatures'
          required:
          - pk
          - uuid
          - availability
          - contact
          - company
          - affiliate_company
          - customers
          - invoice_price
          - invoice_price_display
          - display_id
          - external_id
          - order
          - status
          - rebooked_from
          - rebooked_to
          - confirmation_url
          - voucher_number
          - online_booking_references
          - receipt_subtotal
          - receipt_subtotal_display
          - receipt_taxes
          - receipt_taxes_display
          - receipt_total
          - receipt_total_display
          - amount_paid
          - amount_paid_display
          - custom_field_values
          - note
          - note_safe_html
          - pickup
          - arrival
          - effective_cancellation_policy
          - is_eligible_for_cancellation
          - agent
          - desk
          - payments
          - dashboard_url
          - customer_count
