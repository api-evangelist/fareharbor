      ## Entire script
      ```
          import json
          import requests
      
          APP_KEY = 'your app key'
          USER_KEY = 'your user key'
      
          HEADERS = {
              'X-FareHarbor-API-App': APP_KEY,
              'X-FareHarbor-API-User': USER_KEY
          }
      
          ROOT_URL = 'https://test.fareharbor.com/api/external/v1'
      
          # COMPANIES
      
          companies_url = '%s/companies/' % ROOT_URL
      
          print(companies_url)
      
          response = requests.get(companies_url, headers=HEADERS)
      
          response_data = json.loads(response.text)
          companies = response_data['companies']
      
          for company in companies:
              print(company)
      
          # ITEMS
      
          company = companies[0]
      
          items_url = '%s/companies/%s/items/' % (ROOT_URL, company['shortname'],)
      
          print(items_url)
      
          response = requests.get(items_url, headers=HEADERS)
      
          response_data = json.loads(response.text)
          items = response_data['items']
      
          for item in items:
              print(item)
      
          # AVAILABILITIES
      
          item = items[0]
      
          availabilities_url = '%s/companies/%s/items/%i/availabilities/date/2015-12-01/' % (
              ROOT_URL,
              company['shortname'],
              item['pk'],
          )
      
          print(availabilities_url)
      
          response = requests.get(availabilities_url, headers=HEADERS)
      
          response_data = json.loads(response.text)
          availabilities = response_data['availabilities']
      
          for availability in availabilities:
              print(availability)
      
          # CUSTOMER TYPE RATES
      
          availability = availabilities[0]
      
          customer_type_rates = availability['customer_type_rates']
      
          for customer_type_rate in customer_type_rates:
              print(customer_type_rate)
      
          # CREATE BOOKING
      
          customer_type_rate = customer_type_rates[0]
      
          book_url = '%s/companies/%s/availabilities/%i/bookings/' % (
              ROOT_URL,
              company['shortname'],
              availability['pk'],
          )
      
          print(book_url)
      
          request_data = {
              'contact': {
                  'name': 'John Doe',
                  'phone': '415-098-1234',
                  'email': 'johndoe@gmail.com'
              },
              'customers': [
                  {
                      'customer_type_rate': customer_type_rate['pk']
                  }
              ],
              "voucher_number": "V-35791209"
          }
          request_data = json.dumps(request_data)
      
          response = requests.post(book_url, data=request_data, headers=HEADERS)
      
          response_data = json.loads(response.text)
          booking = response_data['booking']
      
          print(booking)
      
          # RETRIEVE BOOKING
      
          booking_url = '%s/companies/%s/bookings/%s/' % (
              ROOT_URL,
              company['shortname'],
              booking['uuid'],
          )
      
          print(booking_url)
      
          response = requests.get(booking_url, headers=HEADERS)
      
          response_data = json.loads(response.text)
          booking = response_data['booking']
      
          print(booking)
      ```
      
      # Retrieve Bookings
      ```
      #!/usr/bin/env python
      
      """Retrieve bookings via FH External API
      
      To use this sample script, set the FH_API_APP and FH_API_USER
      environment variables in your shell.
      
      """
      
      import os
      
      import requests
      
      api_base_url = os.environ.get('FH_API_BASE_URL', 'https://fareharbor.com/api/external/v1/')
      
      HEADERS = {
          'X-FareHarbor-API-App': os.environ.get('FH_API_APP', ''),
          'X-FareHarbor-API-User': os.environ.get('FH_API_USER', ''),
      }
      
      date_ranges = [
          ('2023-01-01', '2023-01-08'),
          ('2023-01-08', '2023-01-15'),
          # etc.
      ]
      
      
      def bookings_for_item(company_shortname, item_pk):
          item_bookings = []
          company_url = f'{api_base_url}companies/{company_shortname}/'
          for first, last in date_ranges:
              availabilities_url = f'{company_url}items/{item_pk}/minimal/availabilities/date-range/{first}/{last}/?bookable_only=no'
              print(availabilities_url)
              availabilities = requests.get(availabilities_url, headers=HEADERS).json()['availabilities']
              for availability in availabilities:
                  url = f'{company_url}availabilities/{availability["pk"]}/bookings/'
                  print(url)
                  bookings = requests.get(url, headers=HEADERS).json()['bookings']
                  print(bookings)
                  item_bookings += bookings
          return item_bookings
      
      
      all_bookings = []
      
      companies_url = f'{api_base_url}companies/'
      print(companies_url)
      companies = requests.get(companies_url, headers=HEADERS).json()['companies']
      print(companies)
      for company in companies:
          items_url = f'{companies_url}{company["shortname"]}/items/'
          items = requests.get(items_url, headers=HEADERS).json()['items']
          for item in items:
              all_bookings += bookings_for_item(company['shortname'], item['pk'])
      
      print(f'{len(all_bookings)} total bookings')
      ```
      
      
      
  
  - name: Format
    description: |
      
      # Interchange Format
      
      All interactions with the API are done via JSON.
      
      # Requests
      
      ## Request Body
      
      Some requests (particularly the `POST` to create a booking) require a body.
      The body should consist entirely of a JSON object.
      
      ## Authentication
      
      You'll need to authenticate every request you make the API; see [authentication](#tag/Authentication).
      
      # Responses
      
      ## General Structure
      
      The body of every response is a valid JSON object (and in particular *not* a JSON array,
      number, string, and so on).
      
      ### Success responses
      
      Successful responses contain the data requested.  The structure of these responses is described in detail
      in [data-types](#tag/Data-Types) however in general they follow this structure:
      
      * `<singular type>`: `object`
      
      or
      
      * `<plural type>`: `array`
      
      Examples:
      
      ```
          {
            "company": {
              "shortname": "hawaiianadventures",
              "name": "Hawaiian Adventures"
            }
          }
      ```
      
      ```
          {
            "companies": [
              {
                "shortname": "hawaiianadventures",
                "name": "Hawaiian Adventures"
              }
            ]
          }
      ```
      
      ### Error responses
      
      * `error`: `string`
      
      A message describing the error.
      
      * `status`: `number`
      
      The HTTP status code for the response.
      
      Example:
      
          {
            "error": "Method not allowed",
            "status": 405
          }
      
      Assuming that `response` contains the entire JSON response, a response is an error when `response.error`
      is defined; otherwise it is a success.
      
      ## HTTP Codes
      
      We use the usual HTTP statuses to indicate success:
      
      * 200: Succcess
      
      * 201: Created
      
      A `2xx` response is always indicative of a successful request.
      
      We also use HTTP error codes to indicate the usual sorts of errors; the following
      are the ones you are most likely to encounter.
      
      * 400: Bad Request
      
        The request was invalid and could not be processed.
      
        This is most likely to occur when attempting to create a booking,
        and can correspond to things like attempting to overbook an availability
        or providing invalid data like customer name, phone number, etc.
      
      * 403: Forbidden
      
        You do not have permission to access this endpoint in this way.
      
        Review [authentication](#tag/Authentication) and verify that you are sending the
        correct API keys, and that you do indeed have permission to access to
        endpoint you are attempting to access.
      
      * 404: Not Found
      
        The company, item, or availability does not exist; it may have been
        deleted or otherwise become unavailable, or you may have an incorrect ID.
      
      * 405: Method Not Allowed
      
        You are trying to use an unsupported HTTP method (`GET`, `POST`, and so on)
        with this endpoint.
      
      * 420: Enhance Your Calm
      
        Returned when a request has been rate-limited due to too many concurrent
        connections. It is *very* unlikely that you will encounter this in normal
        usage.
      
      * 500: Internal Server Error
      
        An unexpected error occured.
      
      * 503: Service Unavailable
      
        FareHarbor is temporarily unavailable, but will return shortly. Try again later.
      
      A `4xx` request is always indicative of an problem with the request being made,
      while a `5xx` error indicates a server-side error.
      
      A detailed list of error codes and messages are described in [error-codes](#tag/Error-Codes)
      
      
  
  - name: Orders
    description: |
      
      Multiple bookings can be grouped into an **Order**.  This feature is beneficial for API Partners and Affiliates who want to offer bundled experiences to increase guest satisfaction and revenue.  For example, they can allow guests to book multiple activities at once or to create custom packages booking activities one by one.  This can increase operational efficiency for activity providers.
      
      # General Outline of the Creation of an Order
      An **Order** represents a bundle of **Bookings**, and every booking is created the same way (whether as part of an order or not), with one crucial difference.  In every case, the `POST` **Bookings** endpoint is used (see [Bookings](#tag/Bookings-Endpoints/operation/post-bookings)) following the flow detailed below:
      
      1. Make the first booking.
      2. Save the `uuid` field value from the response.
      3. From the second booking on, insert the `uuid` value from step 2 into the `orderize_booking` field of the request.
      4. Every additional booking will have the same value in the response field `order.display_id`.  This is the order id in common to all the bookings making up the order.
      
      ### Example Response
      ```
      {
        "booking": {
          "affiliate_company": {
            "currency": "usd",
            "name": "Test Affiliate",
            "shortname": "affiliate"
          },
          ...
          "order": { "display_id": "ABTU" },
          ...
          "source_type": "external-api",
          "status": "booked",
          "uuid": "869b0840-80ce-46a6-abf9-4fb12c7d4143",
          "voucher_number": "V1",
          "waiver_signatures": {}
        }
      }
      ```
      
      # Requirements
      1. Before adding bookings to an order, the charter company offering the availabilities being booked must have Orders enabled in their FareHarbor dashboard under company advanced settings.
      1. All availabilities booked under an order must belong to the same charter company.
      1. Every booking bundled inside an order will be created for the `contact` passed in the `POST` request for the initial booking.  The `contact` in all subsequent booking `POST` requests will be ignored.
      
      ### Error Response
      If the charter company does not have orders enabled, the following error will be returned:
      
      ```
      {"error":"Orders not allowed","status":403,"code":"orderize-booking-uuid-invalid-error"}
      ```
      
      # Retrieving an Order
      The only identifier necessary for retrieving an order is the `uuid` of one of the bookings in the order.  Since the `uuid` of the first booking was used when creating the second booking and possibly all the subsequent bookings, the same `uuid` can be used for retrieval, as well.  But any of the other bookings' `uuid`s would work, as well.
      
      The endpoint used is the normal `GET` [Booking](#tag/Bookings-Endpoints/operation/get-booking).
      
      When the booking being retrieved is part of an order, the response will contain the following `related_bookings` data structure:
      
      ```
      {...,
          related_bookings: {
             related_order: {
                 id: AHWS,
                 bookings: [
                     uuid1,
                     uuid2,
                     ...
                 ],
             },
          },
          ...
      }
      ```
      
      As this example illustrates, the booking in question belongs to `order_id: AHWS`, and the array of `bookings` below that order lists all the `uuid`s of bookings in the same order.
      
      Currently, the API only permits the creation of a single order of related bookings.  If the retrieved booking belongs to an order, the `related_bookings` object will contain its `order_id` and a list of bookings.  Otherwise, `related_bookings` will be an empty object.
      
      
      
  
  - name: Rebooking
    description: |
      
      If it is necessary to change a booking to another date/time or change customer types/count, the booking must be cancelled and a new booking must be created.  Rebooking is a shortcut for that process.
      
      To rebook an existing booking, specify the existing booking's UUID value for the `rebooking` property when creating a booking. Note: valid values for all properties required by the create booking request must be provided.
      
      Example request:
      
          $ curl -X POST \
          -H "X-FareHarbor-API-App: YOUR-APP-KEY" \
          -H "X-FareHarbor-API-User: YOUR-USER-KEY" \
          -d \
          '{
             "rebooking": "d75102be-9732-4523-90a8-c698eff2b983",
             "contact": {
               "name": "John Doe",
               "phone": "+1-415-789-4563",
               "email": "johndoe@example.com"
             },
             "customers": [
               {
                 "customer_type_rate": 65675
               },
               {
                 "customer_type_rate": 65675
               }
             ],
             "note": "Optional booking note.",
             "voucher_number": "V-35791209"
          }' \
          https://fareharbor.com/api/external/v1/companies/hawaiianadventures/availabilities/5796/bookings/
      
      Example response:
      
          {
            "booking": {
              "pk": 7974877,
              "uuid": "10414711-3d20-4f4d-8ab3-eeaea26c2be3",
              "rebooked_from": "d75102be-9732-4523-90a8-c698eff2b983",
              "status": "booked",
              ...
          }
      
      The response includes a `rebooked_from` property that provides the source booking's UUID.
      
      Bookings that have been rebooked have a "rebooked" status. The `rebooked_to` property provides the UUID of the new booking.
      
      Example rebooked booking:
      
          {
            "booking": {
              "pk": 6876876,
              "uuid": "d75102be-9732-4523-90a8-c698eff2b983",
              "rebooked_to": "10414711-3d20-4f4d-8ab3-eeaea26c2be3"
              "status": "rebooked",
              ...
          }
      
      ### Cancelling a Rebooked Booking
      
      If you create a booking, then rebook it, and then cancel *either the original or the rebooked booking*, you will get the same response: the `Booking` object for the rebooked booking (not the original). Assuming the cancellation succeeds, the `status` of the rebooked booking will become `cancelled`. (The status of the original booking remains `rebooked` even after you have cancelled the rebooked booking.)
      
      
      
  
  - name: Webhooks
    description: |
      
      # What is a webhook
      
      A webhook is an HTTPS request sent from FareHarbor to a server of your
      choice as a result of an event.
      
      FareHarbor can send webhooks when bookings are created, updated,
      rebooked, or cancelled, when a contact changes, when a checkin occurs,
      when items are updated, when crew members are created, updated, or deleted,
      etc.
      
      For ideas about how to use webhooks in concert with the External API,
      see [FAQ and Best Practices](#tag/FAQ-And-Best-Practices).
      
      # Configuring webhooks
      
      You can provide two webhook URLs to FareHarbor: one for production
      webhooks and one for test webhooks.
      
      Contact <support@fareharbor.com> to configure these.
      
      (Note: The server for the production webhook URL must have a valid SSL
      certificate. If it doesn't have one, then the webhook will not be
      delivered. It is up to you to ensure that your SSL certificates get
      renewed as needed.)
      
      (Note: Companies in demo mode do not trigger webhooks.)
      
      Your server should respond to the webhook with an HTTP success
      response code. If FareHarbor receives an HTTP error response or no
      response at all, then the webhook will be retried some number of
      times, with a significant pause between attempts. If FareHarbor detects
      too many failures (non-200 statuses) within a short period of time, we
      may deactivate the webhook and contact you.
      
      ## Booking notifications
      
      When a booking-related event occurs, FareHarbor sends a `POST` request to
      the webhook URL that you have provided.
      
      Depending on how your webhooks are configured, these `POST` requests will be sent for:
      
      * all changes to bookings (including creations, modifications, and cancellations);
      * creations only; or
      * cancellations only.
      
      The body of this request contains an up-to-date JSON representation of
      the booking.
      
      There are four booking data types that can be sent to a webhook: A full set of data
      contained in the booking fields, as well as optimized versions of each type to reduce
      the amount of fields, thereby decreasing the amount of data you need to store and
      process (filter).
      
      * **Bookings only** (default setting). The data returned in this data type includes:
      *Contact Name*, *Phone*, *Email*, *Activity*, *Availability*, *Customer Types*,
      *Custom Fields*, *Subtotal*, *Tax*, *Total* and *Amount paid* from a booking. Note
      that payment and refund information is not included with this data type.
      * **Bookings only (Optimized)**: This data type returns a smaller group of fields
      as compared to **Bookings only**, in order to improve performance and give you only
      the data that is of most importance to you. Note that these fields also **do not**
      include payment or refund information.
      The following data fields are returned using this data type: *Item*, *Company*,
      *Contact*, *Availability*, *Customers*, *Custom field values*, *Effective cancellation
      policy*, *Invoice*, *Receipt*, *Amount paid*, *Agent*, *Desk*, *Status* and *Rebooked*.
      * **Bookings + payments**: If you want to send payment and refund data, in addition
      to what is sent with Bookings only, select this type for all bookings fields and
      including payment information.
      * **Bookings + payments (Optimized)**: Use this data type when you want to receive
      a subset of bookings data, as compared to the full **Bookings + payments** output.
      The data returned for the optimized call will also include payment and refund
      information. Sending data using an optimized connection can enhance server performance
      during the API call by filtering out only the most frequently used fields. This will
      also allow you to more effectively manage only the data that is of interest.
      * **Create custom booking schema:** This data type allows you to customize what specific booking data will be included. You can update the included booking data for a custom webhook at any time by clicking the webhook’s **Edit** option under the **Webhook** tab.
      
      Some of the fields are described [here](#tag/Data-Types).
      
      Depending how your webhook is configured and what fields you are
      allowed to view, there may also be a `payments` property:
      
          {
            "booking": {
              "pk": 456,
              "payments": [
                {
                  "amount_paid": 1939,
                  "amount_paid_display": "19.39",
                  "created_at": "2020-07-23T14:43:30-1000",
                  "currency": "usd",
                  "initial_amount_paid": 2154,
                  "initial_amount_paid_display": "21.54",
                  "pk": 6234,
                  "refunds": [
                    {
                      "amount_refunded": 215,
                      "amount_refunded_display": "2.15",
                      "created_at": "2020-07-23T14:43:41-1000",
                      "is_cancelled": false,
                      "pk": 1123
                    }
                  ],
                  "status": "succeeded",
                  "type": "affiliate",
                  "in_store_payment_type": {
                     "pk": 137,
                     "name": "Cash",
                     "note_label": "Note"
                  },
                  "in_store_payment_note": ""
                }
              ],
              ...
            }
          }
      
      When the payment is `type: "in-store"`, the `in_store_payment_type` in
      the response has the pk, name, and note label of the in-store payment
      type. The `in_store_payment_note` is the note value entered for that
      payment (for example, a room number).
      
      When the payment is `type: "affiliate"` and the payment is an
      affiliate in-store payment, the `in_store_payment_type` in the
      response has the pk of the in-store payment type and may have the name
      as well.
      
      When the payment is not an in-store payment, the
      `in_store_payment_type` in the response is `null`.
      
      ## Item notifications
      
      When an item-related event occurs, FareHarbor sends a `POST` request to
      the webhook URL that you have provided.
      
      The body of this request contains a JSON representation of
      some of the details that will help you identify the item that
      was updated. For further details on what actually changed on the item,
      the webhook contains the external API URL and the dashboard URL.
      
      * The `external_api_url` found in the JSON can be used by interested
      parties to make an additional External API call to the particular item
      which will return the most up to date item information.
      * The `dashboard_url` found in the JSON can be used to find out what has
      changed.  The activity log can be used to see what has been changed and when.
      
          {
            "item": {
              "pk": 1867,
              "name": "Jet Ski Tour",
              "company": {
                "name": "Hawaiian Adventures",
                "shortname": "hawaiianadventures",
                "currency": "usd"
              },
              "external_api_url": "https://fareharbor.com/api/external/v1/companies/hawaiianadventures/items/1867",
              "dashboard_url": "https://fareharbor.com/hawaiianadventures/dashboard/items/1867/"
            }
          }
      
      Contact <support@fareharbor.com> to have the item webhook turned on for your account.
      
      ## Crew member notifications
      
      When a crew member-related event occurs, FareHarbor sends a `POST` request to
      the webhook URL that you have provided.
      
      These `POST` requests will be sent for:
      
      * crew member creations and modifications;
      * crew member disabling/enabling; or
      * crew member deletions.
      
      The body of this request contains a JSON representation of the crew member,
      including the user information, role, and status.
      
          {
            "crew_member": {
              "pk": 789,
              "user": {
                "name": "John Smith",
                "username": "jsmith"
              },
              "role": {
                "pk": 12,
                "short_name": "captain"
              },
              "note": "Experienced captain with 10+ years",
              "availability_id": 1234,
              "status": "active"
            }
          }
      
      Contact <support@fareharbor.com> to have the crew member webhook turned on for your account.
      
      ## Third-party servers
      
      If you do not have your own servers, you can use third-party services
      that receive webhooks on your behalf.
      
      ## Failing webhooks
      
      If your webhook is functioning normally, it should always return a 200
      HTTP status.
      
      Sometimes FareHarbor sends a webhook to your server and there is a
      failure of one sort or another. See
      [Question: 500s and 40x responses from webhooks](#tag/Webhooks/Webhook-FAQs/Question:-500s-and-40x-responses-from-webhooks)
      for a discussion of why this might happen and how you can fix it.
      
      If FareHarbor detects too many failures (non-200 statuses) within a
      short period of time, we may deactivate the webhook and contact you.
      
      Ultimately, it is your responsibility to make sure that the webhook
      is working.
      
      # Webhook Schemas
      
      ## Booking
      ```
      {
        "$schema": "http://json-schema.org/draft-04/schema#",
        "type": "object",
        "properties": {
          "booking": {
            "$ref": "#/definitions/booking"
          }
        },
        "required": ["booking"],
        "additionalProperties": false,
      
        "definitions": {
          "availability": {
            "type": "object",
            "properties": {
              "pk": {
