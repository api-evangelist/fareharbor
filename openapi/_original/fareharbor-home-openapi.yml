      ## Capacities
      
      Note that availabilities have both an overall capacity, and customer type rates have an (optional) capacity.
      Both capacities, if specified, cannot be exceeded, despite the fact that the sum of available
      capacities of the customer type rates may not match the available capacity of the availability
      itself.
      ## Extended Option
      
      Extended options are applicable to custom fields of type `extended-option`.
      
      * `pk`: `number`
      
        The extended option's unique ID.
      
      * `name`: `string`
      
        The extended option's name.
      
      * `description`: `markdown`
      
        The extended option's description.
      
      * `modifier_kind`: `string`
      
        Can be `offset` or `percentage`. Determines whether an offset or percentage
        is used when the total is adjusted or set.
      
      * `modifier_type`: `string`
      
        Can be `adjust` or `set`. Determines whether the total is adjusted or set.
      
      * `offset`: `amount`
      
        When `modifier_type` is `adjust`: a positive or negative amount value.
      
        When `modifier_type` is `set`: a positive amount value.
      
        Only applicable when `modifier_kind` is `offset`.
      
      * `percentage`: `number`
      
        When `modifier_type` is `adjust`: a number between -100 and 100 inclusive.
      
        When `modifier_type` is `set`: a number between 0 and 100 inclusive.
      
        Only applicable when `modifier_kind` is `percentage`.
      
      * `is_always_per_customer`: `bool`
      
        Whether pricing should be applied to each customer (when the customer field
        is at the booking level).
      
      * `is_taxable`: `bool`
      
        Whether the cost of this option should affect the taxable total of a booking.
      
      Example:
      
          {
            "pk": 105,
            "name": "Helmet",
            "description": "Need a helmet?",
            "modifier_kind": "percentage",
            "modifier_type": "adjust",
            "offset": null,
            "percentage": 35,
            "is_always_per_customer": true,
            "is_taxable": false
          }
      ## Custom Field
      
      * `pk`: `number`
      
        The custom field's unique ID.
      
      * `type`: `string`
      
        The custom field's type. Supported types: `yes-no`, `short`, `long`,
        `extended-option`, `count`, and `date`.
      
      * `is_required`: `bool`
      
        Indicates whether the custom field requires a value.
      
      * `description`: `markdown`
      
        The custom field's description.
      
      * `name`: `string`
      
        The name of the custom field.
      
      * `booking_notes`: `markdown`
      
        Notes for the customer specific to the custom field.
      
      * `offset`: `amount`
      
        A positive or negative amount value.
      
      * `extended_options`: `[ ExtendedOption ]`
      
        A list the custom field's extended options. This will only be provided
        for custom fields that have type `extended-option`.
      
      Example:
      
          {
            "pk": 4502,
            "type": "extended-option"
            "is_required": false,
            "description": "Do you need additional safety equipment?",
            "name": "Safety Equipment",
            "offset": 100,
            "extended_options": {
              "pk": 105,
              "name": "Helmet",
              "description": "Need a helmet?",
              "modifier_kind": "percentage",
              "modifier_type": "adjust",
              "offset": null,
              "percentage": 35,
              "is_always_per_customer": true,
              "is_taxable": false
            }
          }
      
      ## Custom Field Instance
      
      * `pk`: `number`
      
        The custom field instance's unique ID.
      
      * `custom_field`: `CustomField`
      
        The custom field associated with the custom field instance.
      
      Example:
      
          {
            "pk": 2681,
            "custom_field": {
              "pk": 4502,
              "type": "yes-no"
              "is_required": false,
              "description": "Do you need additional safety equipment?",
              "name": "Safety Equipment",
              "offset": 100,
              "extended_options": {
                "pk": 105,
                "name": "Helmet",
                "description": "Need a helmet?",
                "modifier_kind": "percentage",
                "modifier_type": "adjust",
                "offset": null,
                "percentage": 35,
                "is_always_per_customer": true,
                "is_taxable": false
              }
            }
          }
      ## Custom Field Value
      
      * `custom_field`: `CustomField.pk`
      
        A valid Custom Field pk.
      
      * `value`: `string`
      
        A string up to 2048 characters. If the custom field is of type `yes-no`,
        "true" or "false" must be specified. If the custom field is of type
        `extended-option`, an extended option pk must be specified. If the custom
        field is of type `date`, a date string in `YYYY-MM-DD` format must be
        specified.
      
      Example:
      
          {
            "custom_field": 4502,
            "value": "false",
            "extended-option": 105
          }
      
      ## Crew Member
      
      A `CrewMember` object represents a user assigned to work on a specific availability. Crew members can have assigned roles and notes that provide context about their responsibilities or special instructions.
      
      * `pk`: `integer`
      
        The crew member's unique identifier. This ID is specific to the crew member assignment and can be used for updating or removing the crew member from the availability.
      
      * `user`: `User`
      
        The user assigned as a crew member. Contains the user's name and username for identification purposes.
      
      * `role`: `Role | null`
      
        The role assigned to the crew member, if any. Roles help categorize crew members and define their responsibilities within the organization. This field is optional and can be null if no specific role is assigned.
      
      * `note`: `string`
      
        A text note providing additional context, instructions, or information about the crew member's assignment. This can include special responsibilities, equipment assignments, or any other relevant details.
      
      Example:
      
          {
            "crew_member": {
              "pk": 12345,
              "user": {
                "name": "John Smith",
                "username": "jsmith"
              },
              "role": {
                "pk": 1,
                "short_name": "captain"
              },
              "note": "Responsible for safety briefing and equipment check"
            }
          }
      
      Example with no role assigned:
      
          {
            "crew_member": {
              "pk": 12346,
              "user": {
                "name": "Jane Doe",
                "username": "jdoe"
              },
              "role": null,
              "note": "General crew member"
            }
          } 
      ## User
      
      A `User` object represents a person who can be assigned as a crew member to availabilities. Users are identified by their name and username within the system.
      
      * `name`: `string`
      
        The user's full name as it appears in the system. This is typically the user's first and last name combined and is used for display purposes in crew rosters and assignments.
      
      * `username`: `string`
      
        The user's unique username within the system. This is used for identification and assignment purposes when adding crew members to availabilities. The username must be unique across the system.
      
      Example:
      
          {
            "user": {
              "name": "John Smith",
              "username": "jsmith"
            }
          }
      
      Example in crew member context:
      
          {
            "users": [
              {
                "name": "John Smith",
                "username": "jsmith"
              },
              {
                "name": "Jane Doe",
                "username": "jdoe"
              },
              {
                "name": "Mike Johnson",
                "username": "mjohnson"
              }
            ]
          } 
      ## Role
      
      A `Role` object represents a specific position or responsibility that can be assigned to crew members. Roles help organize crew members by their duties and responsibilities within the company's operations.
      
      * `pk`: `integer`
      
        The role's unique identifier. This ID is used when assigning roles to crew members and for referencing the role in other operations.
      
      * `short_name`: `string`
      
        The role's short name or title. This is a concise identifier for the role that is used in crew member assignments and displays. Examples might include "captain", "guide", "safety_officer", or "mechanic".
      
      Example:
      
          {
            "role": {
              "pk": 1,
              "short_name": "captain"
            }
          }
      
      Example in roles list context:
      
          {
            "roles": [
              {
                "pk": 1,
                "short_name": "captain"
              },
              {
                "pk": 2,
                "short_name": "guide"
              },
              {
                "pk": 3,
                "short_name": "safety_officer"
              },
              {
                "pk": 4,
                "short_name": "mechanic"
              }
            ]
          }
      
      Example in crew member context:
      
          {
            "crew_member": {
              "pk": 12345,
              "user": {
                "name": "John Smith",
                "username": "jsmith"
              },
              "role": {
                "pk": 1,
                "short_name": "captain"
              },
              "note": "Responsible for safety briefing and equipment check"
            }
          } 
      
      
  
