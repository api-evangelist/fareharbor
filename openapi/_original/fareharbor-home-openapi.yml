  - name: Authentication
    description: |
      
      An app key and a user key are required to authenticate all requests to
      the FareHarbor external API.  The app key identifies your application,
      and can be used for all of your affiliates. The user key identifies a specific
      user on a specific affiliate.
      
      These keys are in UUID format. Note that these keys *must* be kept private. 
      If your key is disclosed publicly please contact support@fareharbor.com to have it rotated.
      
      ## Keys sent as headers (recommended)
      
      The recommended approach to passing your keys is via the custom headers
      `X-FareHarbor-API-App` and `X-FareHarbor-API-User`.
      
      ```
      GET /api/external/v1/companies/ HTTP/1.1
      Host: fareharbor.com
      X-FareHarbor-API-App: APP-KEY
      X-FareHarbor-API-User: USER-KEY
      
      $ curl -H "X-FareHarbor-API-App: APP-KEY" -H "X-FareHarbor-API-User: USER-KEY" https://fareharbor.com/api/external/v1/companies/
      ```
      
      ## Requesting Keys
      If you would like to pursue an integration with the FareHarbor API, please contact strategicpartnerships@fareharbor.com so that we can review your request.
      
      Note that we cannot grant access in all cases.
      
      
      
  
  - name: Booking Overlay Links
    description: |
      
      Partners can deep-link customers into FareHarbor's online booking flow with query parameters that pre-select affiliate attribution, party size, and related booking context.
      
      These URLs open the FareHarbor booking lightbox (often called the booking overlay) for a specific company, item, and availability. Use them when an integration should send a customer into FareHarbor's hosted checkout instead of creating the booking through the External API.
      
      ## URL pattern
      
      Build the URL from External API identifiers:
      
      ```
      https://fareharbor.com/embeds/book/{company_shortname}/items/{item_pk}/availability/{availability_pk}/book/
      ```
      
      | Path segment | Source |
      | --- | --- |
      | `{company_shortname}` | Company `shortname` |
      | `{item_pk}` | Item `pk` |
      | `{availability_pk}` | Availability `pk` |
      
      Example:
      
      ```
      https://fareharbor.com/embeds/book/test-company/items/123/availability/456/book/?full-items=yes&asn=demoaffiliate&asn-ref=DEMO-REF-001&ref=PartnerCheckout&ctrs=123456:2
      ```
      
      This opens the booking form for availability `456` on item `123`, attributes the booking to affiliate `demoaffiliate`, stores `DEMO-REF-001` as the affiliate voucher/reference, sets online booking reference `PartnerCheckout`, and pre-selects 2 of customer type rate `123456`.
      
      ## Example query parameters
      
      The parameters below are common examples for pre-populated booking overlay links. They are not an exhaustive list of every embed query parameter.
      
      | Parameter | Purpose | Example |
      | --- | --- | --- |
      | `asn` | Affiliate company shortname | `asn=demoaffiliate` |
      | `asn-ref` | Affiliate voucher / reference for `asn` | `asn-ref=DEMO-REF-001` |
      | `back` | Redirect URL used when closing or going back | `back=https://example.com/tours` |
      | `branding` | Show company branding in the booking overlay | `branding=yes` |
      | `ctrs` | Pre-select customer type rate quantities | `ctrs=123456:2` or `ctrs=123456:2,123457:1` |
      | `full-items` | Open the full item details booking experience | `full-items=yes` |
      | `language` | Preferred language, when supported | `language=en-us` |
      | `ref` | Online booking reference on the resulting booking | `ref=PartnerCheckout` |
      
      ### Affiliate parameters (`asn` and `asn-ref`)
      
      * `asn` is the FareHarbor shortname of the affiliate company attached to the booking.
      * `asn-ref` is the affiliate voucher/reference value for that relationship.
      
      For many direct affiliate integrations:
      
      ```
      ?asn=demoaffiliate&asn-ref=YOUR-VOUCHER-OR-REFERENCE
      ```
      
      For FareHarbor Distribution Network (FHDN) flows, use the FHDN affiliate shortname in `asn` and the selling affiliate's shortname in `asn-ref`:
      
      ```
      ?asn=fhdn&asn-ref=demoaffiliate
      ```
      
      Confirm the exact FHDN shortname and affiliation setup for your integration with FareHarbor before using this pattern in production.
      
      ### Customer type quantities (`ctrs`)
      
      `ctrs` pre-fills ticket counts using **customer type rate** primary keys from the availability response, not customer type primary keys.
      
      ```
      ctrs={customer_type_rate_pk}:{quantity}[,{customer_type_rate_pk}:{quantity}...]
      ```
      
      Examples:
      
      ```
      ctrs=123456:2
      ctrs=123456:2,123457:1
      ```
      
      * Each `{customer_type_rate_pk}` must match a visible customer type rate on the target availability.
      * Quantities must be positive integers.
      * Prefill is all-or-nothing: if any requested customer type rate cannot be matched, no quantities are prefilled.
      
      Use `availability.customer_type_rates[].pk` from the [Availabilities endpoints](#tag/Availabilities-Endpoints). See [Customer Type Rate](#tag/Data-Types/Schemas/Customer-Type-Rate).
      
      ### Online booking reference (`ref`)
      
      `ref` sets the booking's online booking reference. When present, it is available on booking responses and booking webhooks as `online_booking_references`.
      
      ### Display and navigation (`branding`, `language`, `back`)
      
      * `branding=yes` shows company branding in the booking overlay.
      * `language` requests a preferred language using a language code such as `en-us`; it applies only when that language is supported.
      * `back` sets a redirect URL used when the customer closes or navigates back from the overlay. It must be a full URL.
      
      ## Contact information
      
      Name, email, and phone cannot currently be pre-populated through public booking overlay URL query parameters.
      
      Customers enter contact details in the FareHarbor booking form, or the partner creates the booking through the [Bookings endpoints](#tag/Bookings-Endpoints) and supplies contact information in the request body.
      
      ## Notes
      
      * These links open FareHarbor's hosted booking UI. They do not replace External API booking creation.
      * Customer type rate primary keys are availability-specific. Always build `ctrs` from the availability you are linking to.
      * Affiliate attribution requires a valid affiliation between the affiliate (`asn`) and the company being booked.
      * Demo environment links use the same path shape on `https://demo.fareharbor.com/`.
      
      
      
  
  - name: Cancellation Policies
    description: |
      
      In order for cancellations to be made via API, all connections must be assigned a technical cancellation policy in the supplier’s settings in FareHarbor. As a standard step in the enablement process, we assign the **Default - API** cancellation policy when we set up every new API partner with access to mutual suppliers.
      
      *The Default - API cancellation policy allows for a booking to be canceled up until the availability start time (which are given in company local time). If a cancellation is attempted through the API for a booking after the exact start time of that availability has passed, it will be met with an error.*
      
      This allows the API partner to set cancellation policies and restrictions in their own system, and  regardless of the cancellation policy agreed to between the API partner and the supplier (ex. 72 hours, 24 hours, 2 hours) our system will always allow the cancellation as long as the start time of that availability has not yet passed. We do this to allow API partners to implement cancellation restrictions on their end and to defer to their policy for when they allow their customer to cancel.
      
      **Grace Period**
      
      Regardless of any cancellation policy, the FareHarbor API will allow the immediate cancellation of a booking if it is requested within 5 minutes.
      
      **Disclaimer**
      
      API Partners should discuss and determine the cancellation terms for bookings made in their partnerships with suppliers, and the API Partner should have the ability to enforce them in their integrations. The Default API cancellation policy is intentionally open so that FareHarbor can always facilitate the cancellation and keep the supplier's availabilities up to date, but it should not be interpreted as the supplier’s "official" policy. Just because this default setting will technically allow the cancellation request up until the start time does not mean the supplier allows it.
      
      ## Understanding Cancellation Policy Fields in the API
      
      Cancellation policies are referenced in a few different ways, which we will aim to make clear here.
      
      Firstly, the Default API cancellation policy that we have been describing here is exposed on the **[Detailed Items](#tag/Items-Endpoints/operation/get-items)** endpoint (when `detailed=yes` is specified in the query string) as the `effective_cancellation_policy`. It indicates that the API will allow a cancellation up until 0.0 hours before the start of the availability.
      
      API Partners should **not** import this field, as it only reflects the default setting across all integrations and does not reflect the supplier’s preferences or any policy that they have agreed to with the API Partner.
      
      Separately on the **Items** endpoint you will find the `cancellation_policy` field, where the supplier may input their own cancellation information as text.
      
      ```
      "cancellation_policy": "A full refund will be issued if notice is given at least 24 hours before start time.",
      ```
      
      This is where the supplier may describe their cancellation policies and processes, however it is important to note that this field is not required for suppliers, so it may be blank. It is also important to note that whatever is written in the `cancellation_policy`  field is what suppliers display on their own website - so it is not customized for API Partners.
      
      If you receive an unexpected `400 booking-cancellation-error` code, you may contact api-support@fareharbor.com to confirm the cancellation settings and see if any changes are needed.
      
      ## Items Endpoint
      
      When `detailed=yes` is specified as the query string for the items endpoint, an `effective_cancellation_policy` property will be provided for each item that specifies data regarding the effective cancellation policy as shown in the responses to the following endpoints:
      
      * [GET items](#tag/Items-Endpoints/operation/get-items)
      * [GET item](#tag/Items-Endpoints/operation/get-item).
      
      The `type` property specifies the effective cancellation policy type. The following types are supported:
      
      * `hours-before-start` - bookings are eligible for cancellation some number of hours before availability start time.
      * `hours-before-midnight` - bookings are eligible for cancellation some number of hours before midnight on availability start date.
      * `always` - bookings are eligible for cancellation up until a cutoff that is determined by the availability (usually the availability start time).
      * `never` - bookings are never eligible for cancellation (e.g. no effective cancellation policy, insufficient privileges, cancellation disallowed by policy).
      
      The `cutoff_hours_before` property specifies the number of hours for the `hours-before-start` and `hours-before-midnight` types. Note: this value can be negative indicating that bookings can be cancelled some number of hours after availability start time (when type is `hours-before-start`) or some number of hours after midnight on availability start date (when type is `hours-before-midnight`). The `cutoff_hours_before` property provides `null` when no cutoff is applicable (when bookings are never eligible for cancellation).
      
      ## Availability Endpoints
      
      When `detailed=yes` is specified as the query string for the availabilities endpoints, an `effective_cancellation_policy` property is provided for each availability that specifies data regarding the effective cancellation policy as shown in the responses of the following availabilities endpoints:
      
      * [GET availabilities by date](#tag/Availabilities-Endpoints/operation/get-minimal-availabilities-by-date)
      * [GET availabilities by date range](#tag/Availabilities-Endpoints/operation/get-minimal-availabilities-by-date-range)
      The `type` property specifies the effective cancellation policy type (see the items endpoint section for more details).
      
      The `cutoff` property specifies the last possible time (ISO8601 timestamp in company local time) bookings are eligible for cancellation. The `cutoff` property provides `null` when no cutoff is applicable (when bookings are never eligible for cancellation).
      
      ## Retrieve Booking Endpoint
      
      An `is_eligible_for_cancellation` and `effective_cancellation_policy` property is provided in the response to the following booking endpoints:
      
      * [GET booking](#tag/Bookings-Endpoints/operation/get-booking)
      * [DELETE booking](#tag/Bookings-Endpoints/operation/delete-booking)
      * [PUT booking note](#tag/Bookings-Endpoints/operation/put-update-booking-note)
      * [POST bookings](#tag/Bookings-Endpoints/operation/post-bookings)
      
      The `is_eligible_for_cancellation` property provides a boolean value indicating whether the booking is currently eligible for cancellation.
      
      The `type` property specifies the effective cancellation policy type (see the items endpoint section for more details).
      
      The `cutoff` property specifies the last possible time (ISO8601 timestamp in company local time) the booking is eligible for cancellation. The `cutoff` property provides `null` when no cutoff is applicable (when the booking is never eligible for cancellation).
      
      
      
  
  - name: Custom Fields
    description: |
      
      Custom fields allow an activity company to provide booking options and collect information from their customers during the booking process. For example, scuba companies often use custom fields to collect the height, weight, and shoe size of their customers during the booking process so they can set aside gear that fits properly for a dive.
      
      ## Custom Field Instances
      
      A custom field instance represents an available booking option. Details regarding the booking option are specified by the custom field associated with the custom field instance.
      
      ## Custom Field Types
      
      The API currently supports the following custom field types: `short`, `long`, `extended-option`, `yes-no`, `count` and `date`.  Values for `short` and `long` custom fields can be any string under 2048 characters.  Values for `extended-option` custom fields must be an `extended_option` pk defined in the `extended_options` property for the custom field.  Values for `yes-no` custom fields must be boolean. Values for `count` custom fields must be an integer. Values for `date` custom fields must be a date string in `YYYY-MM-DD` format. (Email-type custom fields are not supported in the external API due to PII concerns.)
      
      ## Customer and Booking Level Custom Fields
      
      `custom_field_instances` under a `customer_type_rate` specify customer level custom fields (i.e. custom fields that are applicable to the `customer_type` specified by the `customer_type_rate`). `custom_field_instances` under an availability specify booking level custom fields (i.e. custom fields that are applicable to the entire booking).
      
      ## Priced vs unpriced custom fields
      
      - Priced CFs change the booking price when selected (e.g., a yes/no with a % modifier, or an extended option with a fixed/percentage surcharge/discount).
      - Unpriced CFs do not change price.
      
      Defaulting rules:
      - Unpriced CFs: May be defaulted when omitted from the POST payload, subject to visibility/requirements.
      - Priced CFs: Not auto-defaulted. They only affect price when explicitly included in `custom_field_values`.
      - Required CFs remain required; missing required priced CFs produce a validation error.
      
      ## Custom Field Values
      
      Booking custom fields:
      
        Values for booking custom fields are specified by including a
        `custom_field_values` property at the root level with the following form:
      
        * `custom_field_values`: `array`
          * `custom_field`: `CustomField.pk`
          * `value`: `string`
      
      If a custom field is priced, include it explicitly in `custom_field_values` to apply its price; priced defaults are not auto-applied.
      
      Customer custom fields:
      
        Values for customer custom fields are specified by including a
        `custom_field_values` property at the customer level with the following form:
      
        * `customers`: `array`
          * `custom_field_values`: `array`
            * `custom_field`: `CustomField.pk`
             * `value`: `string`
      
      If a custom field is priced, include it explicitly in `custom_field_values` to apply its price; priced defaults are not auto-applied.
      
      Example:
      
          {
             "contact": {
               "name": "John Doe",
               "phone": "+1-415-789-4563",
               "email": "johndoe@example.com"
             },
             "customers": [
               {
                 "customer_type_rate": 8964453,
                 "custom_field_values": [
                   {
                     "custom_field": 123,
                     "value": "true"
                   }                            // priced yes-no
                 ]
               }
             ],
             "custom_field_values": [
               {
                 "custom_field": 456,
                 "value": "6745"                // unpriced
               }
             ],
             "voucher_number": "V-35791209"
          }
      
      ## Example
      
      Consider the following example availability response (the ellipses represent properties that have been left out for the sake of brevity):
      
          {
            "availabilities": [
              {
                "start_at": "2016-05-10T10:30:00-1000",
                "end_at": "2016-05-10T11:00:00-1000",
                "online_booking_status": "auto",
                "item": {
                  "pk": 5000,
                  "name": "Glider Rides"
                },
                "pk": 9999,
                "customer_type_rates": [
                  {
                    "pk": 555,
                    "customer_type": {
                      "pk": 1111,
                      "plural": "Scenic Ride (1 passenger)",
                      "singular": "Scenic Ride (1 passenger)"
                    },
                    "custom_field_instances": [
                      {
                        "pk": 4321,
                        "custom_field": {
                          "pk": 1,
                          "type": "yes-no",
                          "name": "Add an extra 30 minutes of flight time?",
                          ...
                        },
                        ...
                      },
                      ...
                    ],
                    ...
                  },
                  ...
                ],
                "custom_field_instances": [
                  {
                    "pk": 1234,
                    "custom_field": {
                      "pk": 2,
                      "type": "short",
                      "name": "Hotel and Room Reservation Name",
                      ...
                    }
                  },
                  ...
                ],
                ...
              },
              ...
            ]
          }
      
      ### Customer Level Custom Field
      
      The custom field in the above example with `pk` 1 is a customer level custom field. It is a `yes-no` type custom field, so it accepts true/false values.
      
      ### Booking level Custom Field
      
      The custom field in the above example with `pk` 2 is a booking level custom field.  It is a `short` type custom field, so it accepts any string value (less than 2048 characters).
      
      ### Booking Creation
      
      The example data below shows how one specifies custom field values for customer level custom fields (`pk` 1) and booking level custom fields (`pk` 2) when creating a booking.
      
          {
            "voucher_number": "123",
            "customers": [
              {
                "custom_field_values": [
                  {
                    "custom_field": 1,
                    "value": true
                  }
                ],
                "customer_type_rate": 555
              }
            ],
            "contact": {
              "phone": "+1-123-456-7890",
              "name": "John Doe",
              "email": "johndoe@example.com"
            },
            "custom_field_values": [
              {
                "custom_field": 2,
                "value": "Hawaiian Village Waikiki Beach Resort Room 415"
              }
            ]
          }
      
      
      
  
  - name: Data Types
    description: |
      
      # Fields
      
      
      ## Markdown fields
      
      Many of the fields returned by the API contain user-defined Markdown.
      We also return the rendered HTML version of the field.  In the following
      schemas, fields of type `markdown` actually contain a `string`, and imply
      a second field in the schema containing the rendered HTML.  So the following:
      
      * `field`: `markdown`
      
      Should be treated as if it were:
      
      * `field`: `string`
      * `field_safe_html`: `string`
      
      The "safe" part of the field name indicates that only a limited subset
      of HTML is allowed; all other HTML entities are escaped.
      ## Amount fields
      
      All currency amounts are returned as an integer number of the smallest
      negotiable unit of money in the company's currency. In the case of
      USD, this means USD cents. So, for instance, `1425` means $14.25 USD.
      
      Some amount fields may have corresponding fields whose names are
      suffixed with `_display`. These fields will contain strings
      representing the same amount of money, but using the customary
      formatting for the company's country. For instance, in the case of
      US/USD, this will be the string `14.25`. Note that some countries may
      use a comma rather than a period as the decimal point.
      
      * `field`: `number`
      * `field_display`: `string`
      ## Datetime fields
      
      All datetimes are returned in ISO8601 format; for example `2013-02-04T06:21:36+0000`
      
      * `field`: `string`
      
      # Schemas
      
      
      ## Address
      
      Structured address data.
      
      * `city`: `string`
      
      * `country`: `string`
      
      * `postal_code`: `string`
      
      * `province`: `string`
      
      * `street`: `string`
      
      Example:
      
          {
            "city": "Honolulu",
            "country: "US",
            "postal_code": "96821",
            "province": "HI",
            "street": "123 Wailupe Cir"
          }
      ## Company
      
      ### Minimal Representation
      
      A `Company` object represent an affiliate or provider.
      
      * `shortname`: `string`
      
        The company's ID.
      
      * `name`: `string`
      
        The company's name.
      
      * `currency`: `string`
      
        The company's currency.
      
      Example:
      
          {
            "shortname": "hawaiianadventures",
            "name": "Hawaiian Adventures",
            "currency": "usd"
          }
      
      ### Extended Representation
      
      The extended representation provides additional information about the company (see below).
      
      * `about`: `markdown`
      
        About page content for the company.
      
      * `booking_notes`: `markdown`
      
        General notes for booking customers.
      
      * `faq`: `markdown`
      
        FAQ page content for the company.
      
      * `intro`: `markdown`
      
        Homepage content for the company.
      
      * `summary`: `string`
      
        A short tagline or summary for the company.
      
      * `url`: `string`
      
        The company's website address.
      
      * `facebook_url`: `string`
      
        The company's Facebook address.
      
      * `instagram_url`: `string`
      
        The company's Instagram address.
      
      * `tripadvisor_url`: `string`
      
        The company's TripAdvisor address.
      
      * `twitter_url`: `string`
      
        The company's Twitter address.
      
      * `yelp_url`: `string`
      
        The company's Yelp address.
      
      * `youtube_url`: `string`
      
        The company's Youtube address.
      
      * `pinterest_url`: `string`
      
        The company's Pinterest address.
      
      * `address`: `Address`
      
        The company's physical address.
      
      * `affiliated_since`: `datetime`
      
        If the API user’s company is an affiliate, then we will see a timestamp of when the relationship started.
      
      * `billing_address`: `Address`
      
        The company's billing address.
      
      * `health_and_safety_policy`: `markdown`
      
        The company's health and safety policy. This is supplemental to the item level `health_and_safety_policy` field, and is only displayed on the FareHarbor Dashboard if the specific item does not have a value for `health_and_safety_policy` set.
      
      * `open_hours`: `object | null`
      
        Represents the company's general opening and closing times. Used for general company information or for context for all-day availabilities, but should not be used in place of specific availability start and end times.
      
        If open hours have been set for this company, then `open_hours` is an object whose keys are names of days of the week. The value for each day is either `null`, if the company is closed that day; or an object whose keys are `open_time` and `close_time`, which specify the open time and close time that day in 24-hour HH:MM format.
      
        Otherwise, `open_hours` will be `null`.
      
      Example:
      
          {
            "company": {
              "shortname": "hawaiianadventures",
              "name": "Hawaiian Adventures",
              "currency": "usd",
              "about": "Hawaiian Adventures offers several water activities that you are sure to enjoy.",
              "about_safe_html": "<p>Hawaiian Adventures offers several water activities that you are sure to enjoy.</p>",
              "booking_notes": "Weather conditions will be evaluated at the time of check-in.\n\n-If using a voucher, please bring the voucher with you.",
              "booking_notes_safe_html": "<p>Weather conditions will be evaluated at the time of check-in.\n\n-If using a voucher, please bring the voucher with you.</p>",
              "faq": "# What should I bring?\n\nWe suggest that you bring a swimming suit, a towel, and sunscreen.",
              "faq_safe_html": "<h1>What should I bring?</h1>\n<p>We suggest that you bring a swimming suit, sunscreen, and a towel.</p>",
              "intro": "We offer the best water activities on Oahu",
              "intro_safe_html": "<p>We offer the best water activities on Oahu</p>",
              "summary": "Water activities 365 days a year",
              "url": "https://company-url.com",
              "facebook_url": "https://facebook.com/url",
              "instagram_url": "https://instagram.com/url",
              "tripadvisor_url": "https://tripadvisor.com/url",
              "twitter_url": "https://twitter.com/url",
              "yelp_url": "https://yelp.com/url",
              "youtube_url": "https://youtube.com/url",
              "pinterest_url": "https://pintrest.com/url",
              "address": {
                "city": "Honolulu",
                "country": "US",
                "postal_code": "96821",
                "province": "HI",
                "street": "123 Wailupe Cir"
              },
              'affiliated_since': '2020-06-17T15:44:03+0000',
              "billing_address": {
                "city": "Honolulu",
                "country": "US",
                "postal_code": "96821",
                "province": "HI",
                "street": "123 Wailupe Cir"
              },
              "health_and_safety_policy": "Your health is our top priority, and we have put special measures in place to keep all guests safe both during and after your activity.\n\n* Stringent Cleaning – We've increased the frequency of disinfecting surfaces and high touch areas.\n* Social Distancing – Guests are required to stay 6 feet apart.\n* Wellness Checks – Employees receive daily wellness checks to ensure they are healthy and symptom-free.",
              "health_and_safety_policy_safe_html": "<p>Your health is our top priority, and we have put special measures in place to keep all guests safe both during and after your activity.</p>\n<ul>\n<li>Stringent Cleaning – We've increased the frequency of disinfecting surfaces and high touch areas.</li>\n<li>Social Distancing – Guests are required to stay 6 feet apart.</li>\n<li>Wellness Checks – Employees receive daily wellness checks to ensure they are healthy and symptom-free.</li>\n</ul>",
              "open_hours": {
                "monday": {
                  "open_time": "10:00",
                  "close_time": "17:00"
                },
                "tuesday": {
                  "open_time": "10:00",
                  "close_time": "17:00"
                },
                "wednesday": {
                  "open_time": "10:00",
                  "close_time": "17:00"
                },
                "thursday": {
                  "open_time": "10:00",
                  "close_time": "17:00"
                },
                "friday": {
                  "open_time": "10:00",
                  "close_time": "17:00"
                },
                "saturday": null,
                "sunday": null
              }
            }
          }
      
      ## Agent
      
      * `pk`: `number`
      
        The agent's unique ID.
      
      * `name`: `string`
      
        The agent's name.
      
      
      Example:
      
          {
            "pk": 231,
            "name": "Eddie"
          }
      ## Desk
      
      * `pk`: `number`
      
        The desk's unique ID.
      
      * `name`: `string`
      
        The desk's name.
      
      
      Example:
      
          {
            "pk": 231,
            "name": "Windward Side"
          }
      ## Lodging
      
      * `pk`: `number`
      
        The lodging's unique ID.
      
      * `name`: `string`
      
        The Lodging's name.
      
      * `phone`: `string`
      
        The lodging's phone number.
      
      * `address`: `string`
      
        The lodging's address.
      
      * `url`: `string`
      
        The lodging's URL.
      
      * `is_self_lodging`: `bool`
      
        Whether the lodging is a customer provided, non-hotel lodging (e.g. private residence).
      
      Example:
      
          {
            "pk": 231,
            "name": "Wyndham Royal Garden",
            "phone": "(808) 943-0202",
            "address": "440 Olohana St Honolulu, HI 96815",
            "url": "https:\/\/www.extraholidays.com\/honolulu-hawaii\/royal-garden-at-waikiki.aspx",
            "is_self_lodging": false
          }
      
      ## Image
      
      * `pk`: `number`
      
        The image's unique ID.
      
      * `gallery`: `string`
      
        The image's gallery name.
      
      * `image_cdn_url`: `string`
      
        The image's URL.
      
      Example:
      
          {
            "pk": 687,
            "gallery": "carousel",
            "image_cdn_url": "https:\/\/d1a2dkr8rai8e2.cloudfront.net\/api\/file\/rvybRyLWTgyV5w4xg42p\/"
          }
      
      ## Location
      
      * `pk`: `number`
      
        The location's unique ID.
      
      * `type`: `string`
      
        The location's type.
      
      * `note`: `markdown`
      
        A brief note about this location that can be displayed to end users.
      
      * `address`: `Address`
      
        The location's physical address.
      
      * `longitude`: `number | null`
      
        The location's longitude.
      
      * `latitude`: `number | null`
      
        The location's latitude.
      
      * `google_place_id`: `string`
      
        The location's Google Place ID.
      
      * `tripadvisor_url`: `string`
      
        The location's TripAdvisor URL.
      
      Example:
      
          {
            "pk": 234234,
            "type": "primary",
            "note": "Next to the blue fence.",
            "note_safe_html": "<p>Next to the blue fence.</p>",
            "address": {
              "city": "Honolulu",
              "country": "US",
              "postal_code": "96821",
              "province": "HI",
              "street": "123 Wailupe Cir"
            },
            "longitude": 21.3069,
            "latitude": -157.8583,
            "google_place_id": "ChIJYZ4srGUSAHwRT1Da4amp3x",
            "tripadvisor_url": "https://www.tripadvisor.com/Attraction_Review-g60982-d184886-Reviews-Epic_Jet_Ski_Tour-Honolulu_Oahu_Hawaii.html",
          }
      ## Cancellation Policy
      
      * `type`: `string`
      
        The cancellation policy's type. Supported types:
      
        * `hours-before-start`
      
            Bookings are eligible for cancellation some number of hours before availability start time.
      
        * `hours-before-midnight`
      
            Bookings are eligible for cancellation some number of hours before midnight on availability start date.
      
        * `always`
      
            Bookings are eligible for cancellation up until a cutoff that is determined by the availability (usually the availability start time).
      
        * `never`
      
            Bookings are never eligible for cancellation (e.g. no effective cancellation policy, insufficient privileges, cancellation disallowed by policy).
      
      * `cutoff_hours_before`: `number`
      
        The number of hours for the `hours-before-start` and `hours-before-midnight` types.
      
        Note: this value can be negative indicating that bookings can be cancelled some number of hours after availability start time (when type is `hours-before-start`) or some number of hours after midnight on availability start date (when type is `hours-before-midnight`). The `cutoff_hours_before` property will provide `null` when no cutoff is applicable (when bookings are never elgible for cancellation).
      
      Example:
      
          {
            "type": "hours-before-start",
            "cutoff_hours_before": "24"
          }
      ## Tag
      
      * `name`: `string`
      
        The tag's display name.
      
      * `short_name`: `string`
      
        The tag's short name. The short name is unique per company and is limited to lowercase letters (a-z), digits (0-9), and the dash character.
      
      Example:
      
          {
            "name": "Jet ski tour",
            "short_name": "jet-ski-tour"
          }
      ## Item
      
      Items represent a particular kind of tour that the company offers.
      
      * `pk`: `number`
      
        The item's unique ID.
      
      * `name`: `string`
      
        The name of the item.
      
      * `headline`: `string`
      
        The item's headline.
      
      * `description`: `markdown`
      
        The item's description.
      
      * `description_text`: `string`
      
        The item's plain-text description.
      
      * `description_bullets`: `[ string ]`
      
        An array containing plain-text descriptive bullet points for the item.
      
      * `cancellation_policy`: `markdown`
      
        The item's cancellation policy.
      
      * `location`: `string`
      
        The location of the item; generally where the activity takes place
        or where the tour leaves from, but can be anything. Unstructured.
      
      * `locations`: `[ Location ]`
      
        An array of `Location` objects associated with the item.
      
      * `is_pickup_ever_available`: `bool`
      
        Indicates whether the item is configured to provide pickups.
      
      * `image_cdn_url`: `string`
      
        A URL to the item's primary image.
      
      * `images`: `[ Image ]`
      
        An array of `Image` objects associated with the item.
      
      * `customer_prototypes`: `[ CustomerPrototype ]`
      
        An array of `CustomerPrototype` objects associated with the item.
      
      * `health_and_safety_policy`: `markdown`
      
        The item's health and safety policy. It includes details and procedures related to specific activities for the item like the precautions being taken, equipment to bring, and any additional special rules.
      
      Example:
      
          {
            "pk": 1867,
            "name": "Jet Ski Tour",
            "headline": "Epic Jet Ski Tour",
            "description": "We are conveniently located just 5 minutes from Waikiki and will arrange for pickup\/dropoff at or near your hotel.",
            "description_safe_html": "\u003cp\u003eWe are conveniently located just 5 minutes from Waikiki and will arrange for pickup\/dropoff at or near your hotel.\u003c\/p\u003e",
            "description_text": "We are conveniently located just 5 minutes from Waikiki and will arrange for pickup\/dropoff at or near your hotel.",
            "description_bullets": [
              "Located just 5 minutes from Waikiki.",
              "Transportation included."
            ],
            "cancellation_policy": "A full refund will be issued if notice is given at least 24 hours before start time.",
            "cancellation_policy_safe_html": "\u003cp\u003eA full refund will be issued if notice is given at least 24 hours before start time.\u003c\/p\u003e",
            "location": "Honolulu, HI",
            "locations": [
              {
                "pk": 234234,
                "type": "primary",
                "note": "Next to the blue fence.",
                "note_safe_html": "<p>Next to the blue fence.</p>",
                "address": {
                  "city": "Honolulu",
                  "country": "US",
                  "postal_code": "96821",
                  "province": "HI",
                  "street": "123 Wailupe Cir"
                },
                "longitude": 21.3069,
                "latitude": -157.8583,
                "google_place_id": "ChIJYZ4srGUSAHwRT1Da4amp3x",
                "tripadvisor_url": "https://www.tripadvisor.com/Attraction_Review-g60982-d184886-Reviews-Epic_Jet_Ski_Tour-Honolulu_Oahu_Hawaii.html",
              }
            ],
            "is_pickup_ever_available": true,
            "image_cdn_url": "https:\/\/d1a2dkr8rai8e2.cloudfront.net\/api\/file\/rvybRyLWTgyV5w4xg42p\/",
            "images": [
              {
                "pk": 687,
                "gallery": "carousel",
                "image_cdn_url": "https:\/\/d1a2dkr8rai8e2.cloudfront.net\/api\/file\/rvybRyLWTgyV5w4xg42p\/"
              }
            ],
            "customer_prototypes": [
              {
                "pk": 2522,
                "display_name": "Adult",
                "total": 20000
              }
            ],
            "health_and_safety_policy": "Every lifejacket and seat is thoroughly disinfected both before and after each tour.  Hand sanitizer is available to all guests prior to boarding, during the tour, and after debarking the boat.",
            "health_and_safety_policy_safe_html": "<p>Every lifejacket and seat is thoroughly disinfected both before and after each tour.  Hand sanitizer is available to all guests prior to boarding, during the tour, and after debarking the boat.</p>"
          }
      
      ### Item Details
      
      When `detailed=yes` is specified as the query string for the items endpoint, additional details are provided for each item.
      
      * `effective_cancellation_policy`: `CancellationPolicy`
      
        Cancellation policy data for the item.
      
      * `tags`: `[ Tag ]`
      
        An array of `Tag` objects associated with the item.
      
      Example:
      
          {
            "pk": 1867,
            "effective_cancellation_policy": {
              "type": "hours-before-start",
              "cutoff_hours_before": 24
            },
            "tags": [
              {
                "name": "Jet ski tour",
                "short_name": "jet-ski-tour"
              },
              {
                "name": "Water activity",
                "short_name": "water-activity"
              },
              {
                "name": "Transportation included",
                "short_name": "transportation"
              },
              ...
            ],
            ...
          }
      
      ## Customer Type
      
      Customer types represent different kinds of customers that might do an activity, for
      example "Adults", "Children", "Infants". Note however that FareHarbor companies use
      customer types to represent a range of different sorts of customers; for instance,
      some SCUBA companies use types like "Diver", "Snorkeler", and "Observer".
      
      * `pk`: `number`
      
        The customer type's unique ID.
      
      * `singular`: `string`
      * `plural`: `string`
      
        The singular and plural forms of the name of this customer type; ex. "adult", "adults".
      
      * `note`: `string`
      
        A brief note about this customer type that can be displayed to end users.
      
      Example:
      
          {
            "pk": 589,
            "singular": "Adult",
            "plural": "Adults",
            "note": "At least 18 years old."
          }
      ## Customer Prototype
      
      * `pk`: `number`
      
        The customer prototype's unique ID.
      
      * `display_name`: `string`
      
        The customer prototype's display name.
      
      * `total`: `amount`
      
        The price of a single customer of this type.
      
      * `total_including_tax`: `amount`
      
        The price of a single customer of this type plus applicable taxes.
      
      Example:
      
          {
            "pk": 2522,
            "display_name": "Adult",
            "total": 20000,
            "total_including_tax": 21550
          }
      
      ## Customer Type Rate
      
      Customer type rates set capacity and pricing information for customer types on
      a particular availability.
      
      ### Minimal Representation
      
      * `pk`: `number`
      
        The customer type rate's unique ID.
      
      * `customer_type`: `CustomerType`
      
      The customer type being priced.
      
      * `capacity`: `number`
      
        The maximum number of customers of this type that can currently book this availability;
        this number will change over time as other customers book.
      
      * `is_exclusive`: `bool`
      
        Indicates that this customer type rate is "exclusive"; see below for how exclusivity
        affects bookability.
      
      Example:
      
          {
            "pk": 978,
            "capacity": 10,
            "is_exclusive": false,
            "customer_type": {
              "pk": 589,
              "singular": "Adult",
              "plural": "Adults",
              "note": "At least 18 years old.",
              "customer_prototype": {
                "pk": 2522,
                "display_name": "Adult",
                "total": 20000,
                "total_including_tax": 21550
              }
            }
          }
      
      ### Extended Representation
      
      The extended representation provides additional information about the customer type rate (see below).
      
      * `total`: `amount`
      
        The price of a single customer of this type.
      
      * `total_including_tax`: `amount`
      
        The price of a single customer of this type plus applicable taxes.
      
      * `custom_field_instances`: `[ CustomFieldInstance ]`
      
        A list of custom field instances for the customer type rate.
      
      Example:
      
          {
            "pk": 978,
            "total": 20000,
            "total_including_tax": 21550,
            "capacity": 10,
            "is_exclusive": false,
            "customer_type": {
              "pk": 589,
              "singular": "Adult",
              "plural": "Adults",
              "note": "At least 18 years old.",
              "customer_prototype": {
                "pk": 2522,
                "display_name": "Adult",
                "total": 20000,
                "total_including_tax": 21550
              }
            },
            "custom_field_instances": [
              {
                "pk": 8629,
                "custom_field": {
                  "pk": 43879,
                  "type": "yes-no",
                  ...
                }
              }
            ]
          }
      ## Cost
      
      A cost object represents the different facets that might have an impact on how
      individual line items affect the price of a booking, such as taxes, fees, etc.
      
      * `price`: `number`
      
        The line item price.
      
      * `tax`: `number`
      
        The tax price.
      
      * `taxable`: `number`
      
        The portion of the price that is subject to taxes.
      
      * `feeable`: `number`
      
        The portion of the price the is subject to fees.
      
      * `tax_by_type`:
      
        A breakdown of taxes by tax type.
      
      * `total`: `number`
      
        The total cost after taxes and fees.
      
      Example:
      
          "total_cost": {
            "price": 38900,
            "tax": 0,
            "taxable": 38900,
            "feeable": 38900,
            "tax_by_type": {
              53558: 0
            },
            "total": 38900
          }
      ## Availability
      
      Availability objects represent particular datetimes that an item goes out.
      
      ### Minimal Representation
      
      * `pk`: `number`
      
        The availabilities's unique ID.
      
      * `start_at`: `datetime`
      * `end_at`: `datetime`
      
        The availability's start and end time; note that this time can be arbitrarily long or short,
        and that `start_at` can equal `end_at` for "point" availabilities.
      
      * `capacity`: `number`
      
        The overall maximum number of customers that can currently book this availability;
        this number will change over time as other customers book.
      
      * `customer_type_rates`: `[ CustomerTypeRate ]`
      
        Pricing information for available customer types (minimal version).
      
      * `online_booking_status`: `string`
      
        The availability's status. Supported types: `auto`, `open`, `call`, `closed`, `cancelled`.
      
      Example:
      
          {
            "pk": 50291151,
            "start_at": "2023-08-18T00:30:00-0600",
            "end_at": "2023-08-18T03:30:00-0600",
            "capacity": 3,
            "minimum_party_size": 1,
            "maximum_party_size": null,
            "online_booking_status": "auto",
            "customer_type_rates": [
              {
                "pk": 65675,
                "capacity": 10,
                "customer_type": {
                  "pk": 978,
                  "singular": "Adult",
                  "plural": "Adults",
                  "note": "At least 18 years old.",
                  "customer_prototype": {
                    "pk": 2522,
                    "display_name": "Adult",
                    "total": 20000
                  }
                }
              }
            ]
          }
      
      ### Extended Representation
      
      The extended representation provides additional information about the availability (see below).
      
      * `item`: `Item`
      
        The availability's item (minimal version).
      
      * `headline`: `string`
      
        The availability's headline.
      
      * `customer_type_rates`: `[ CustomerTypeRate ]`
      
        Pricing information for available customer types (extended version).
      
      * `custom_field_instances`: `[ CustomFieldInstance ]`
      
        A list of custom field instances for the availability.
      
      Example:
      
          {
            "pk": 4786,
            "start_at": "2015-01-22T11:30:00-1000",
            "end_at": "2015-01-22T13:30:00-1000",
            "capacity": 10,
            "item": {
              "pk": 1867,
              "name": "Jet Ski Tour"
            },
            "headline": "Epic Jet Ski Tour",
            "customer_type_rates": [
              {
                "pk": 65675,
                "total": 20000,
                "capacity": 10,
                "customer_type": {
                  "pk": 978,
                  "singular": "Adult",
                  "plural": "Adults",
                  "note": "At least 18 years old.",
                  "customer_prototype": {
                    "pk": 2522,
                    "display_name": "Adult",
                    "total": 20000
                  },
                  "custom_field_instances": [
                    {
                      "pk": 8629,
                      "custom_field": {
                        "pk": 43879,
                        "type": "yes-no",
                        ...
                      }
                    }
                  ]
                }
              }
            ],
            "custom_field_instances": [
              {
                "pk": 47974,
                "custom_field": {
                  "pk": 3387,
                  "type": "yes-no",
                  ...
                }
              }
            ]
          }
      
      ## Order
      
      Orders are a way of grouping collections of bookings so that they can be created or cancelled as a block.
      
      A booking can belong to an order, but it doesn't have to. An order can include any number of bookings.
      
      * `display_id`: `string`
      
        A unique identifier for the order.
      
      Example:
      
          {
            "display_id": "ABTT"
          }
      ## Booking
      
      When `with_payments=yes` is specified as a query string to the bookings endpoint, the payment information is provided for the booking. The `payments` parameter will be the same as the `payments` in webhooks that can be found [here](#tag/Webhooks/Webhook-Schemas/Booking-with-Payments).
      
      * `pk`: `number`
      
        The booking's unique ID.
      
      * `uuid`: `string`
      
        The booking's universally unique identifier; used to access the booking via the API.
      
      * `display_id`: `string`
      
        The customer's "ticket number;" used only for rendering.
      
      * `availability`: `Availability`
      
        The availability to which this booking corresponds.
      
      * `contact`: `Contact`
      
        Contact information for this booking.  A contact consists of:
      
          * `name`: `string`
      
              The name of the head of the party.
      
          * `phone`: `string`
      
              The contact phone number for the party.
      
          * `normalized_phone`: `string`
      
              The party's contact phone number. This will have a plus sign, the country code, and no extra characters such as commas or dashes.
      
          * `country_phone`: `string`
      
              The contact phone's country code.
      
          * `language`: `string`
      
              The contact language.
      
          * `email`: `string`
      
              The contact email for the party.
      
          * `is_subscribed_for_email_updates`: `bool`
      
              Whether or not the contact would like email updates.
      
      * `customers`: `[ Customer ]`
      
        A list of customers on this booking.  Customers consist of:
      
          * `checkin_url`: `string`
      
            A short URL that can be rendered as a QR code for check-in purposes (the QR code should be "type 4" with "error correction H").
      
          * `checkin_status`: `CheckinStatus | null`
      
            The customer's checkin status.  When there is no checkin status associated with the customer, `checkin_status` will be `null`.  When a checkin status is available, it consists of:
      
              * `name`: `string`
      
                The checkin status' name.
      
              * `type`: `string`
      
                The checkin status' type. Supported types are: `checked-in` and `no-show`.
      
          * `invoice_cost`: `Cost`
      
            The `invoice_cost` will be included only if the permission *View invoice
            prices* is enabled, otherwise it will be `null`.
      
          * `total_cost`: `Cost`
      
            The `total_cost` will be included only if the permission *View amounts* is
            enabled, otherwise it will be `null`.
      
          * `customer_type_rate`: `CustomerTypeRate`
      
            The customer type rate to which this customer corresponds.
      
          * `custom_field_values`: `[ CustomFieldValue ]`
      
            A list of custom field values for the customer.
      
      * `custom_field_values`: `[ CustomFieldValue ]`
      
        A list of custom field values for the booking.
      
      * `invoice_price`: `amount | null`
      
        The invoice price of this booking.  Assuming that the user of the API is a reseller this will
        be the amount that the user of the API owes the vendor on this booking, if the vendor has opted
        to set up that information; otherwise it will be `null`.
      
      * `confirmation_url`: `string`
      
        The booking's confirmation page URL.
      
      * `external_id`: `string`
      
        An additional identifier if necessary.  Max Length 128.
      
      * `order`: `Order | null`
      
        When there is no order associated with the booking, `order` will be `null`.
      
      * `dashboard_url`: `string`
      
        The booking's dashboard URL.
      
      * `customer_count`: `number`
      
        The number of customers on this booking.
      
      * `is_subscribed_for_sms_updates`: `boolean`
      
        Whether or not the contact would like the booking company to send them SMS updates about this booking. Note that the value of this field does not reflect whether or not the user has sent a STOP request to FareHarbor. If the user sends a STOP request to an External API client, that API client should respect that request.
      
      * `payments`: `[ Payment ]` (optional through query string)
      
        Payment information for the booking, only visible through [webhooks](#tag/Webhooks/Webhook-Schemas) or with the `with_payments=yes` query string. If there is no query string, then the `payments` won't show. Payments consist of:
      
          * `amount_paid`: `amount | null`
      
            The total amount that has been paid for the booking.
      
          * `created_at`: `datetime`
      
            When the payment has been paid for the booking.
      
          * `currency`: `string`
      
            The company's currency.
      
          * `initial_amount_paid`: `amount | null`
      
            The amount paid when the booking was first created.
      
          * `refunds`: `Refund | null`
      
            Refund detail of a booking (if there is a refund).
      
              * `amount_refunded`: `amount`
      
                Amount that is refunded.
      
              * `created_at`: `datetime`
      
                Datetime of when the refund occured.
      
              * `is_cancelled`: `boolean`
      
                Wheter or not the booking was cancelled.
      
          * `status`: `string`
      
            Status of the payment for the booking. Supported types are `initialed`, `pending`, `succeeded` and `failed`.
      
          * `type`: `string`
      
            What was used to pay for the booking. Supported types are:
            `card`, `in-store`, `affiliate`, 'stored-value-card`, `ideal`,
            `sofort`, `paypal`, `bancontact`.
      
      Example:
      
          {
            "pk": 6876876,
            "uuid": "d75102be-9732-4523-90a8-c698eff2b983",
            "availability": {
              "pk": 4786,
              "start_at": "2015-01-22T11:30:00-1000",
              "end_at": "2015-01-22T13:30:00-1000",
              "capacity": 10,
              "online_booking_status": "auto",
              "item": {
                "pk": 1867,
                "name": "Jet Ski Tour"
              },
              "customer_type_rates": [
                {
                  "pk": 65675,
                  "total": 20000,
                  "capacity": 10,
                  "is_exclusive": false,
                  "customer_type": {
                    "pk": 978,
                    "singular": "Adult",
                    "plural": "Adults",
                    "note": "At least 18 years old.""
                  }
                }
              ]
            },
            "contact": {
              "name": "Surfer Dude",
              "phone": "+1-443-222-1100",
              "phone_country": "US",
              "normalized_phone": "+14432221100",
              "email": "surfer@dude.com"
            },
            "customers": [
              {
                "checkin_url": "https://fhchk.co/abc",
                "checkin_status": {
                  "name": "checked in",
