openapi: 3.2.0
info:
  title: FareHarbor Integration Center Availabilities Endpoints API
  version: '1.0'
  contact:
    email: support@fareharbor.com
    name: FareHarbor
    url: https://help.fareharbor.com/hc/
  description: The `/availabilities` endpoint is used to retrieve all bookable availabilities for a single item within a specified date or date range.
servers:
- url: https://fareharbor.com/api/external/v1
  description: production
- url: https://demo.fareharbor.com/api/external/v1
  description: demo
tags:
- name: Availabilities Endpoints
  description: The `/availabilities` endpoint is used to retrieve all bookable availabilities for a single item within a specified date or date range.
paths:
  /companies/<shortname>/availabilities/<availability.pk>/lodgings/:
    get:
      summary: Availability Lodgings
      operationId: get-availability-lodgings
      deprecated: false
      tags:
      - Availabilities Endpoints
      parameters:
      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      - schema:
          type: string
          example: 'hawaiianadventures

            '
        name: shortname
        in: path
        required: true
        description: '

          A unique FareHarbor name assigned to each company when their Dashboard is created, used to access the company''s specific information.

          '
      - schema:
          type: integer
          example: '4787

            '
        name: availability.pk
        in: path
        required: true
        description: '

          The unique numerical ID of the requested `Availability` object, that is then used during the booking process.

          '
      responses:
        '200':
          description: '

            Returns an array of `Lodging` objects that include availability specific data.


            The `is_pickup_available` property indicates whether a pickup is offered for the lodging (for the availability specified in the request URL). This value reflects the current state of the system and can change when updates are made.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AVAILABILITY_LODGINGS_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: Used to check lodging options on a specific availability, including whether pick-up is available for each lodging option.
  /companies/<shortname>/availabilities/<availability.pk>/:
    get:
      summary: Availability
      operationId: get-availability
      deprecated: false
      tags:
      - Availabilities Endpoints
      parameters:
      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      - schema:
          type: string
          example: 'hawaiianadventures

            '
        name: shortname
        in: path
        required: true
        description: '

          A unique FareHarbor name assigned to each company when their Dashboard is created, used to access the company''s specific information.

          '
      - schema:
          type: integer
          example: '4787

            '
        name: availability.pk
        in: path
        required: true
        description: '

          The unique numerical ID of the requested `Availability` object, that is then used during the booking process.

          '
      - schema:
          type: string
          example: '[yes|no]

            '
        name: detailed
        in: query
        required: false
        description: '

          Include additional availability details

          '
      responses:
        '200':
          description: '

            Returns an `Availability` object (extended representation).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AVAILABILITY_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: 'Used to pull information for a single availability within FareHarbor.


        To get additional information such as `effective_cancellation_policy` and `effective_booking_cutoff` in the response, add the query parameter `?detailed=yes` to the end of the URL.'
  /companies/<shortname>/items/<item.pk>/minimal/availabilities/date/<date>/:
    get:
      summary: Minimal Availabilities By Date
      operationId: get-minimal-availabilities-by-date
      deprecated: false
      tags:
      - Availabilities Endpoints
      parameters:
      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      - schema:
          type: string
          example: 'hawaiianadventures

            '
        name: shortname
        in: path
        required: true
        description: '

          A unique FareHarbor name assigned to each company when their Dashboard is created, used to access the company''s specific information.

          '
      - schema:
          type: integer
          example: '1867

            '
        name: item.pk
        in: path
        required: true
        description: '

          The unique numerical ID of the bookable product (referred to as `item` in FareHarbor).

          '
      - schema:
          type: string
          format: date
          example: '2015-01-22

            '
        name: date
        in: path
        required: true
        description: '

          `date` should be in the format `YYYY-MM-DD` and is taken to be the in company''s local time.

          '
      - schema:
          type: string
          example: '[yes|no]

            '
        name: detailed
        in: query
        required: false
        description: '

          Include additional availability details

          '
      - schema:
          type: string
          example: '[yes|no]

            '
        name: bookable_only
        in: query
        required: false
        description: '

          Include only availabilities that are bookable

          '
      - schema:
          type: string
          example: '[yes|no]

            '
        name: custom_fields_summary
        in: query
        required: false
        description: '

          Include summarized custom field metadata

          '
      responses:
        '200':
          description: '

            Returns an array of `Availability` objects (minimal representation).


            Returns possibly-bookable availabilities for `date` (in the company''s local time). Note that possibly-bookable availabilities do not include those for which customers are requested to "call to book".


            Excludes custom field information from the response.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: 'Used to fetch all bookable availabilities for a single item within a specified `date` (in the company''s local time) in a simplified format (without custom field information and other fields).


        This variation can be useful for caching availabilities when extra fields are not needed, and it also performs with greater speed.


        To get additional information such as `effective_cancellation_policy` and `effective_booking_cutoff` in the response, add the query parameter `?detailed=yes` to the end of the URL.


        To get metadata information on the custom field instances in the response, add the query parameter `?custom_fields_summary=yes` at the end of the URL.'
  /companies/<shortname>/items/<item.pk>/minimal/availabilities/date-range/<start-date>/<end-date>/:
    get:
      summary: Minimal Availabilities By Date Range
      operationId: get-minimal-availabilities-by-date-range
      deprecated: false
      tags:
      - Availabilities Endpoints
      parameters:
      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      - schema:
          type: string
          example: 'hawaiianadventures

            '
        name: shortname
        in: path
        required: true
        description: '

          A unique FareHarbor name assigned to each company when their Dashboard is created, used to access the company''s specific information.

          '
      - schema:
          type: integer
          example: '1867

            '
        name: item.pk
        in: path
        required: true
        description: '

          The unique numerical ID of the bookable product (referred to as `item` in FareHarbor).

          '
      - schema:
          type: string
          format: date
          example: '2015-01-22

            '
        name: start-date
        in: path
        required: true
        description: '

          Marks the start (inclusive) of the requested time period. `start-date` should be in the format YYYY-MM-DD and taken to be in the company''s local time.

          '
      - schema:
          type: string
          format: date
          example: '2015-01-22

            '
        name: end-date
        in: path
        required: true
        description: '

          Marks the end (inclusive) of the requested time period. `end-date` should be in the format YYYY-MM-DD and taken to be in the company''s local time.

          '
      - schema:
          type: string
          example: '[yes|no]

            '
        name: detailed
        in: query
        required: false
        description: '

          Include additional availability details

          '
      - schema:
          type: string
          example: '[yes|no]

            '
        name: bookable_only
        in: query
        required: false
        description: '

          Include only availabilities that are bookable

          '
      - schema:
          type: string
          example: '[yes|no]

            '
        name: custom_fields_summary
        in: query
        required: false
        description: '

          Include summarized custom field metadata

          '
      responses:
        '200':
          description: '

            Returns an array of `Availability` objects (minimal representation).


            Returns possibly-bookable availabilities for the range `start-date` through `end-date` (in the company''s local time). Note that possibly-bookable availabilities do not include those for which customers are requested to "call to book".


            Excludes custom field information from the response.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: 'Used to fetch all bookable availabilities for a single item within a specified `date` range (in the company''s local time) in a simplified format (without custom field information and other fields). The largest date range that can be pulled in one single request is 7 days.


        This variation can be useful for caching availabilities when extra fields are not needed, and it also performs with greater speed.


        To get additional information such as `effective_cancellation_policy` and `effective_booking_cutoff` in the response, add the query parameter `?detailed=yes` to the end of the URL.


        To get metadata information on the custom field instances in the response, add the query parameter `?custom_fields_summary=yes` at the end of the URL.'
components:
  schemas:
    MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA:
      $schema: http://json-schema.org/draft-04/schema#
      additionalProperties: false
      definitions:
        availability:
          properties:
            capacity:
              description: The overall maximum number of customers that can currently book this availability; this number will change over time as other customers book.
              example: 3
              type: number
            crew_members:
              items:
                $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/crew_member'
              type: array
            custom_field_instances:
              items:
                $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/custom_field_instance_summary'
              type: array
            customer_type_rates:
              items:
                $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/customer_type_rate'
              type: array
            effective_booking_cutoff:
              $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/effective_booking_cutoff'
            effective_cancellation_policy:
              $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/effective_cancellation_policy'
            end_at:
              description: The availability's end time (set in the company's local time); note that this time can be arbitrarily long or short, and that start_at can equal end_at for 'point' availabilities.
              example: 2023-08-18T03:30:00-0600
              format: datetime
              type: string
            headline:
              description: The availability's public headline. Only included when `detailed=yes`.
              example: Epic Jet Ski Tour
              type: string
            maximum_party_size:
              oneOf:
              - example: 1
                type: number
              - type: 'null'
            minimum_party_size:
              oneOf:
              - example: 1
                type: number
              - type: 'null'
            online_booking_status:
              description: The availability's status.
              enum:
              - auto
              - open
              - call
              - closed
              - cancelled
              example: auto
              type: string
            pk:
              description: The availabilities's unique ID.
              example: 50291151
              format: int32
              type: number
            start_at:
              description: The availability's start time (set in the company's local time); note that this time can be arbitrarily long or short, and that start_at can equal end_at for 'point' availabilities.
              example: 2023-08-18T00:30:00-0600
              format: datetime
              type: string
          required:
          - pk
          - start_at
          - end_at
          - capacity
          - minimum_party_size
          - maximum_party_size
          - online_booking_status
          - customer_type_rates
          type: object
        crew_member:
          additionalProperties: false
          properties:
            note:
              description: A note on the crew member.
              type: string
            pk:
              description: The crew member's unique ID.
              format: int32
              type: number
            role:
              $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/role'
              description: The role of the crew member.
            user:
              $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/user'
              description: The crew member user.
          required:
          - pk
          - note
          - user
          type: object
        custom_field_instance_summary:
          additionalProperties: false
          properties:
            custom_field:
              $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/custom_field_summary'
            pk:
              description: The custom field instance's unique ID.
              example: 2681
              format: int32
              type: number
          required:
          - pk
          - custom_field
          type: object
        custom_field_summary:
          additionalProperties: false
          properties:
            is_priced:
              description: Indicates whether the custom field has pricing configured.
              example: false
              type: boolean
            is_required:
              description: Indicates whether the custom field requires a value.
              example: true
              type: boolean
            modifier_kind:
              description: Determines whether an offset or percentage is used when the total is adjusted or set.
              enum:
              - percentage
              - offset
              example: percentage
              type: string
            modifier_type:
              description: Determines whether the total is adjusted or set.
              enum:
              - adjust
              - set
              - none
              example: adjust
              type: string
            name:
              description: The name of the custom field.
              example: Weight
              type: string
            offset:
              description: 'When modifier_type is adjust: a positive or negative amount value. When modifier_type is set: a positive amount value. Only applicable when modifier_kind is offset.'
              type: number
            percentage:
              description: 'When modifier_type is adjust: a number between -100 and 100 inclusive. When modifier_type is set: a number between 0 and 100 inclusive. Only applicable when modifier_kind is percentage.'
              example: 35
              type: number
            pk:
              description: The custom field's unique ID.
              example: 4502
              format: int32
              type: number
            total:
              description: The absolute price of a single custom field of this type when modifier_kind is offset. May be 0 for percentage pricing until applied to a base amount.
              example: 20000
              type: number
            type:
              description: The custom field's type.
              example: short
              type: string
          required:
          - pk
          - name
          - type
          - is_required
          - is_priced
          - modifier_kind
          - modifier_type
          - offset
          - percentage
          - total
          type: object
        customer_prototype:
          additionalProperties: false
          properties:
            display_name:
              description: The customer prototype's display name.
              example: Adult
              type: string
            maximum_age:
              oneOf:
              - description: The maximum age for this customer type (inclusive).
                example: 64
                type: number
              - type: 'null'
            minimum_age:
              oneOf:
              - description: The minimum age for this customer type (inclusive).
                example: 18
                type: number
              - type: 'null'
            note:
              type: string
            pk:
              description: The customer prototype's unique ID.
              example: 2522
              format: int32
              type: number
            total:
              description: The price of a single customer of this type.
              example: 20000
              type: number
            total_including_tax:
              description: The price of a single customer of this type plus applicable taxes.
              example: 21550
              type: number
          required:
          - pk
          - display_name
          - note
          - minimum_age
          - maximum_age
          - total
          type: object
        customer_type:
          additionalProperties: false
          properties:
            note:
              description: A brief note about this customer type that can be displayed to end users.
              example: At least 18 years old.
              type: string
            pk:
              description: The customer type's unique ID.
              example: 589
              format: int32
              type: number
            plural:
              description: The plural form of the name of this customer type.
              example: Adults
              type: string
            singular:
              description: The singular form of the name of this customer type.
              example: Adult
              type: string
          required:
          - pk
          - singular
          - plural
          - note
          type: object
        customer_type_rate:
          additionalProperties: false
          properties:
            capacity:
              oneOf:
              - description: The maximum number of customers of this type that can currently book this availability; this number will change over time as other customers book.
                example: 10
                type: number
              - type: 'null'
            custom_field_instances:
              items:
                $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/custom_field_instance_summary'
              type: array
            customer_prototype:
              $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/customer_prototype'
            customer_type:
              $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/customer_type'
            maximum_party_size:
              oneOf:
              - type: number
              - type: 'null'
            minimum_party_size:
              oneOf:
              - type: number
              - type: 'null'
            pk:
              description: The customer type rate's unique ID.
              example: 978
              format: int32
              type: number
          required:
          - pk
          - capacity
          - minimum_party_size
          - maximum_party_size
          - customer_type
          - customer_prototype
          type: object
        cutoff_time:
          oneOf:
          - description: The cutoff time (in company's local time).
            example: 2024-04-16T00:00:00-1000
            format: datetime
            type: string
          - type: 'null'
        effective_booking_cutoff:
          additionalProperties: false
          properties:
            cutoff:
              $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/cutoff_time'
          required:
          - cutoff
          type: object
        effective_cancellation_policy:
          additionalProperties: false
          properties:
            cutoff:
              $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/cutoff_time'
            type:
              description: The cancellation policy's type
              enum:
              - hours-before-start
              - hours-before-midnight
              - always
              - never
              example: hours-before-start
              type: string
          required:
          - type
          - cutoff
          type: object
        role:
          additionalProperties: false
          properties:
            pk:
              description: The role's unique ID.
              format: int32
              type: number
            short_name:
              description: The roles's short name.
              type: string
          required:
          - pk
          - short_name
          type: object
        user:
          additionalProperties: false
          properties:
            name:
              description: The name of the user.
              type: string
            username:
              description: The username of the user.
              type: string
          required:
          - name
          - username
          type: object
      properties:
        availabilities:
          items:
            $ref: '#/components/schemas/MINIMAL_AVAILABILITIES_RESPONSE_JSON_SCHEMA/definitions/availability'
          type: array
      required:
      - availabilities
      type: object
    AVAILABILITY_RESPONSE_JSON_SCHEMA:
      $schema: http://json-schema.org/draft-04/schema#
      additionalProperties: false
      definitions:
        address:
          additionalProperties: false
          properties:
            city:
              example: Honolulu
              type: string
            country:
              example: US
              type: string
            postal_code:
              example: '96821'
              type: string
            province:
              example: HI
              type: string
            street:
              example: 123 Wailupe Cir
              type: string
          required:
          - city
          - country
          - postal_code
          - province
          - street
          type: object
        availability:
          properties:
            capacity:
              description: The overall maximum number of customers that can currently book this availability; this number will change over time as other customers book.
              example: 3
              type: number
            crew_members:
              items:
                $ref: '#/components/schemas/AVAILABILITY_RESPONSE_JSON_SCHEMA/definitions/crew_member'
              type: array
            custom_field_instances:
              items:
                $ref: '#/components/schemas/AVAILABILITY_RESPONSE_JSON_SCHEMA/definitions/custom_field_instance'
              type: array
            customer_type_rates:
              items:
                $ref: '#/components/schemas/AVAILABILITY_RESPONSE_JSON_SCHEMA/definitions/customer_type_rate'
              type: array
            effective_booking_cutoff:
              $ref: '#/components/schemas/AVAILABILITY_RESPONSE_JSON_SCHEMA/definitions/effective_booking_cutoff'
            effective_cancellation_policy:
              $ref: '#/components/schemas/AVAILABILITY_RESPONSE_JSON_SCHEMA/definitions/effective_cancellation_policy'
            end_at:
              description: The availability's end time (set in the company's local time); note that this time can be arbitrarily long or short, and that start_at can equal end_at for 'point' availabilities.
              example: 2023-08-18T03:30:00-0600
              format: datetime
              type: string
            headline:
              description: The availability's headline.
              example: Epic Jet Ski Tour
              type: string
            item:
              $ref: '#/components/schemas/AVAILABILITY_RESPONSE_JSON_SCHEMA/definitions/item'
            maximum_party_size:
              oneOf:
              - example: 1
                type: number
              - type: 'null'
            minimum_party_size:
              oneOf:
              - example: 1
                type: number
              - type: 'null'
            online_booking_status:
              description: The availability's status.
              enum:
              - auto
              - open
              - call
              - closed
              - cancelled
              example: auto
              type: string
            pk:
              description: The availabilities's unique ID.
              example: 50291151
              format: int32
              type: number
            start_at:
              description: The availability's start time (set in the company's local time); note that this time can be arbitrarily long or short, and that start_at can equal end_at for 'point' availabilities.
              example: 2023-08-18T00:30:00-0600
              format: datetime
              type: string
          required:
          - pk
          - start_at
          - end_at
          - capacity
          - minimum_party_size
          - maximum_party_size
          - online_booking_status
          - headline
          - item
          - customer_type_rates
          - custom_field_instances
          type: object
        crew_member:
          additionalProperties: false
          properties:
            note:
              description: A note on the crew member.
              type: string
            pk:
              description: The crew member's unique ID.
              format: int32
              type: number
            role:
              $ref: '#/components/schemas/AVAILABILITY_RESPONSE_JSON_SCHEMA/definitions/role'
              description: The role of the crew member.
            user:
              $ref: '#/components/schemas/AVAILABILITY_RESPONSE_JSON_SCHEMA/definitions/user'
              description: The crew member user.
          required:
          - pk
          - note
          - user
          type: object
        custom_field:
          additionalProperties: false
          properties:
            booking_notes:
              description: Notes for the customer specific to the custom field.
              example: ''
              format: markdown
              type: string
            booking_notes_safe_html:
              description: Notes for the customer specific to the custom field.
              format: markdown
              type: string
            count_max:
