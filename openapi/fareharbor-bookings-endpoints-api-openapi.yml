            Returns the `Booking` object, including `resource_uses`, with the replacement resource use. The returned resource use may have a new `pk`; clients should use the returned `resource_uses` values for later updates.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BOOKING_WITH_RESOURCE_USES_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: Used to replace an existing resource use on a booking by issuing a `PATCH` request with the new `resource_pk`.
      requestBody:
        description: '

          To update a resource use, provide the `pk` of the resource that should be assigned to that resource use.

          '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RESOURCE_USE_REQUEST_JSON_SCHEMA'
  /companies/<shortname>/minimal/bookings-by-create-date/<date>/:
