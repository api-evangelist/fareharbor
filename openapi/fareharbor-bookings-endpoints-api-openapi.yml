          - city
          - country
          - postal_code
          - province
          - street
          type: object
        affiliate_company:
          oneOf:
          - additionalProperties: false
            properties:
              currency:
                description: The company's currency.
                enum:
                - aed
                - aud
                - bgn
                - brl
                - cad
                - chf
                - czk
                - dkk
                - eur
                - gbp
                - hkd
                - huf
                - mxn
                - nok
                - nzd
                - pln
                - ron
                - sek
                - sgd
                - usd
                example: usd
                type: string
              name:
                description: The affiliate companies name.
                example: Affiliate Company
                type: string
              shortname:
                description: A unique FareHarbor name assigned to each company when their Dashboard is created, used to access the company's specific information.
                example: affiliate_company
                type: string
            required:
            - shortname
            - name
            - currency
            type: object
          - type: 'null'
        affiliate_metadata:
