              enum:
              - yes-no
              - short
              - long
              - extended-option
              - count
              - multi-campaign
              - code-generator
              - date
              example: yes-no
              type: string
          required:
          - pk
          - type
          - is_required
          - description
          - description_safe_html
          - name
          - booking_notes
          - booking_notes_safe_html
          - offset
          - total
