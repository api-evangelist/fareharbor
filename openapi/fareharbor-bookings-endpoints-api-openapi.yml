      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      - schema:
          type: string
          example: 'hawaiianadventures

            '
        name: shortname
        in: path
        required: true
        description: '

          The shortname of the company.

          '
      - schema:
          type: string
          format: date
          example: '2015-01-22

            '
        name: date
        in: path
        required: true
        description: '

          `date` should be in the format `YYYY-MM-DD`.

          '
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VERY_MINIMAL_BOOKINGS_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: This will allow partners to retrieve bookings by create date (in UTC). In the case of an outage where the booking webhook fails this can be used to recover bookings.
  /bookings/resend-confirmation-email/:
    post:
      summary: Resend Confirmation Email
      operationId: post-resend-confirmation-email
      deprecated: false
      tags:
      - Bookings Endpoints
      parameters:
      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      responses:
        '200':
          description: '

            Returns the same generic acknowledgement whether zero or many bookings match.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RESEND_CONFIRMATION_EMAIL_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: 'Queues confirmation email resends for all non-cancelled bookings whose contact email and availability start date match the request. The search spans all bookings and is not limited by the bookings accessible to the supplied keys.


        The response never reveals whether any bookings matched. Confirmation emails are sent only to the address already stored on each matching booking.


        **Rate Limits:**

        In addition to the general rate limits, this endpoint allows 5 requests per minute per app key and user key pair, and 1 request per 5 minutes for the same email address and app key. Exceeding either endpoint-specific limit returns a `429` response.'
      requestBody:
        description: '

          Provide the customer''s email address and an inclusive activity date range of no more than 31 days.

          '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RESEND_CONFIRMATION_EMAIL_REQUEST_JSON_SCHEMA'
components:
  schemas:
    BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA:
