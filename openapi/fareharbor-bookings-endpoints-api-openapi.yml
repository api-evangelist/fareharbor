            affiliate_company:
              $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA/definitions/affiliate_company'
          required:
          - affiliate_company
          type: object
        agent:
          oneOf:
          - additionalProperties: false
            properties:
              name:
                description: The agent's name.
                example: Eddie
                type: string
