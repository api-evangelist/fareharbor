openapi: 3.2.0
info:
  title: FareHarbor Integration Center Bookings Endpoints API
  version: '1.0'
  contact:
    email: support@fareharbor.com
    name: FareHarbor
    url: https://help.fareharbor.com/hc/
  description: The bookings endpoints in the FareHarbor API provide comprehensive functionalities for managing reservations efficiently.
servers:
- url: https://fareharbor.com/api/external/v1
  description: production
- url: https://demo.fareharbor.com/api/external/v1
  description: demo
tags:
- name: Bookings Endpoints
  description: The bookings endpoints in the FareHarbor API provide comprehensive functionalities for managing reservations efficiently.
paths:
  /companies/<affiliate-shortname>/agents/:
    get:
      summary: Agents
      operationId: get-agents
      deprecated: false
      tags:
      - Bookings Endpoints
      parameters:
      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      - schema:
          type: string
          example: 'hawaiianadventures

            '
        name: affiliate-shortname
        in: path
        required: true
        description: '

          The shortname of the affiliate company with which your user key is associated; agents are per-affiliate, not per company.

          '
      responses:
        '200':
          description: '

            Returns an array of `Agent` objects.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AGENTS_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: Used to fetch all agents from the indicated affiliate company.
  /companies/<affiliate-shortname>/desks/:
    get:
      summary: Desks
      operationId: get-desks
      deprecated: false
      tags:
      - Bookings Endpoints
      parameters:
      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      - schema:
          type: string
          example: 'hawaiianadventures

            '
        name: affiliate-shortname
        in: path
        required: true
        description: '

          The shortname of the affiliate company with which your user key is associated; desks are per-affiliate, not per company.

          '
      responses:
        '200':
          description: '

            Returns an array of `Desk` objects.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DESKS_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: Used to fetch all desks from the indicated affiliate company.
  /companies/<shortname>/availabilities/<availability.pk>/bookings/:
    get:
      summary: Bookings
      operationId: get-bookings
      deprecated: false
      tags:
      - Bookings Endpoints
      parameters:
      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      - schema:
          type: string
          example: 'hawaiianadventures

            '
        name: shortname
        in: path
        required: true
        description: '

          A unique FareHarbor name assigned to each company when their Dashboard is created, used to access the company''s specific information.

          '
      - schema:
          type: integer
          example: '4787

            '
        name: availability.pk
        in: path
        required: true
        description: '

          The unique numerical ID of the requested `Availability` object. This should come from whatever availability you select from the `/availability` endpoint.

          '
      responses:
        '200':
          description: '

            Returns a list of simplified `Booking` objects.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BOOKINGS_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: Used to fetch a list of all bookings (in simplified format) for an availability.
    post:
      summary: Bookings
      operationId: post-bookings
      deprecated: false
      tags:
      - Bookings Endpoints
      parameters:
      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      - schema:
          type: string
          example: 'hawaiianadventures

            '
        name: shortname
        in: path
        required: true
        description: '

          A unique FareHarbor name assigned to each company when their Dashboard is created, used to access the company''s specific information.

          '
      - schema:
          type: integer
          example: '4787

            '
        name: availability.pk
        in: path
        required: true
        description: '

          The unique numerical ID of the requested `Availability` object. This should come from whatever availability you select from the `/availability` endpoint.

          '
      responses:
        '200':
          description: "\nReturns the newly created `Booking` object.\n\n**Permissions affect the visibility of certain fields:**\n* The invoice_cost will be included if the permission `View invoice prices` is enabled.\n* The invoice_cost will be null if `View invoice prices` is disabled.\n* The total_cost will be included if the permission `View amounts` is enabled.\n* The total_cost will be null if `View amounts` is disabled.\n\n**invoice_cost** represents the invoice price of the customer type. \n\n**total_cost** represents the total cost of the customer type, including any priced custom fields.\n\nNote: `total_cost` reflects only priced custom fields explicitly provided in the request; priced defaults are not applied automatically.\n\n#### Priced custom fields (behavior change)\n\nWhen the POST payload omits `custom_field_values`, the API will not auto-create values for priced custom fields. Only unpriced custom fields may be defaulted. Priced custom fields apply only when explicitly sent.\n\n- Required fields: Required CFs remain required. If a required priced CF isn’t sent, the request fails with a validation error.\n- What is “priced”? Any CF whose selection changes price (e.g., priced yes/no, or an extended option with a surcharge/discount).\n- Unpriced CFs: Informational fields that do not change price. These may still be defaulted.\n\nExample (omit priced CF → no price change):\n```json\n{\n  \"contact\": { \"name\": \"Jane\", \"email\": \"jane@example.com\", \"phone\": \"555-111-2222\" },\n  \"customers\": [{ \"customer_type_rate\": 12345 }]\n}\n```\n\nExample (include priced CF → price applied):\n```json\n{\n  \"contact\": { \"name\": \"Jane\", \"email\": \"jane@example.com\", \"phone\": \"555-111-2222\" },\n  \"customers\": [\n    {\n      \"customer_type_rate\": 12345,\n      \"custom_field_values\": [\n        { \"custom_field\": 67890, \"value\": true }\n      ]\n    }\n  ]\n}\n```\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: 'Used to create a new booking. To create a booking, the API Partner must assemble 1) the request URL for the availability being booked, and 2) the booking request payload, with all the details of the booking they want to create.


        When creating a booking, several properties about the availability and the booking request must hold or the booking will not be created:


        * **Availability open** - The vendor may close availabilities at any time, and availabilities are automatically closed at various times based on the company''s criteria.

        * **Availability capacity** - There must be available capacity on the availability for all customers

        * **Customer type rate capacities** - For each booked customer type rate there must be available capacity for each customer of that customer type.

        * **Exclusivity** - If any customer type rate being booked is exclusive, then it must be the only customer type rate being booked.

        * **Correct Customer Type Rates** - Each customer type rate being booked must actually belong to the availability being booked.

        * **Orders enabled** - When creating an order, the vendor must have orders enabled in their FareHarbor dashboard.


        ### Transportation


        To request transportation for a booking, specify a `Lodging` pk for the `lodging` property when creating the booking as shown in the example.


        #### Pickup Information


        When a lodging is specified during booking creation and transportation is available for the lodging, the booking response will include a `pickup` property that provides pickup information as shown in the example.


        Note: if a lodging is specified and transportation is not available for the specified lodging (or any lodging), the `pickup` property will have a `null` value.


        #### Arrival Information


        Arrival information is intended for customers who are providing their own transportation. When a lodging is not provided during booking creation or transportation is not available for the specified lodging (or any lodging), arrival information may be provided. When arrival information is available, the booking response will include an `arrival` property that provides arrival information as shown in the example.


        Note: the `arrival` property will have a `null` value if pickup information is available.'
      requestBody:
        description: '

          When creating bookings, use the customer type rate and custom field instance information contained in the availability to construct a request of the following form:

          '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BOOK_REQUEST_JSON_SCHEMA'
  /companies/<shortname>/availabilities/<availability.pk>/bookings/validate/:
    post:
      summary: Validate
      operationId: post-validate
      deprecated: false
      tags:
      - Bookings Endpoints
      parameters:
      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      - schema:
          type: string
          example: 'hawaiianadventures

            '
        name: shortname
        in: path
        required: true
        description: '

          A unique FareHarbor name assigned to each company when their Dashboard is created, used to access the company''s specific information.

          '
      - schema:
          type: integer
          example: '4787

            '
        name: availability.pk
        in: path
        required: true
        description: '

          The unique numerical ID of the requested `Availability` object. This should come from whatever availability you select from the `/availability` endpoint.

          '
      responses:
        '200':
          description: "\nThe response provides an `is_bookable` field indicating whether the booking can be created. If \"true\", the booking is valid and bookable for that availability. The response will also include a pricing calculation for that booking.\n\n    {\n      \"is_bookable\": true,\n      ...\n    }\n\nWhen the booking can't be created, additional information regarding the error is provided:\n\n    {\n      \"is_bookable\":false,\n      \"code\":\"bookability-error\",\n      \"error\":\"Unable to create booking: error details.\"\n    }\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATE_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: 'Checks bookability and provides booking level pricing information.


        Prior to creating the booking, you have the opportunity to confirm that your request is still valid and bookable with the availability and customer type details that you have selected.


        **Things to Note:**

        * If your booking process includes adding a selection to a cart before checking out, this endpoint is highly recommended as it can help to avoid errors at the checkout stage. For example, if you validate the booking as you view the cart, you can ensure that the request is still valid and bookable before collecting payment - and if it is no longer bookable you can give the customer the opportunity to change their selection before proceeding with payment.'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VALIDATE_REQUEST_JSON_SCHEMA'
  /companies/<shortname>/bookings/<Booking.uuid>/:
    get:
      summary: Booking
      operationId: get-booking
      deprecated: false
      tags:
      - Bookings Endpoints
      parameters:
      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      - schema:
          type: string
          example: 'hawaiianadventures

            '
        name: shortname
        in: path
        required: true
        description: '

          A unique FareHarbor name assigned to each company when their Dashboard is created, used to access the company''s specific information.

          '
      - schema:
          type: string
          format: uuid
          example: 'd75102be-9732-4523-90a8-c698eff2b983

            '
        name: Booking.uuid
        in: path
        required: true
        description: '

          The UUID that was generated when you first created the booking.

          '
      - schema:
          type: string
          example: '[yes|no]

            '
        name: with_payments
        in: query
        required: false
        description: '

          Include payments details from the booking

          '
      responses:
        '200':
          description: '

            Returns a `Booking` object.

            '
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA'
                - $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: Used to retrieve the full record of a specific booking that you have made, you may do so by using the UUID that was generated when you first created the booking.
    delete:
      summary: Booking
      operationId: delete-booking
      deprecated: false
      tags:
      - Bookings Endpoints
      parameters:
      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      - schema:
          type: string
          example: 'hawaiianadventures

            '
        name: shortname
        in: path
        required: true
        description: '

          A unique FareHarbor name assigned to each company when their Dashboard is created, used to access the company''s specific information.

          '
      - schema:
          type: string
          format: uuid
          example: 'd75102be-9732-4523-90a8-c698eff2b983

            '
        name: Booking.uuid
        in: path
        required: true
        description: '

          The UUID that was generated when you first created the booking.

          '
      - schema:
          type: string
          example: '[yes|no]

            '
        name: with_payments
        in: query
        required: false
        description: '

          Include payments details from the booking

          '
      responses:
        '200':
          description: '

            Returns the `Booking` object with it''s status updated to `cancelled`.

            '
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA'
                - $ref: '#/components/schemas/BOOKING_WITH_PAYMENTS_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: 'Used to cancel the specified booking by issuing a `DELETE` request.


        **Things to Note:**

        * IMPORTANT - The ability to cancel a booking via API is controlled by cancellation policy settings in FareHarbor. You can read about cancellation expectations here.

        * Regardless of cancellation policy settings, the FareHarbor API will allow cancellations within a 5 minute grace period after a booking is created.


        **Requirements:**

        * The booking must be cancelled at least 48 hours prior to start time (availability start_at property) to receive 100% refund.

        * Any affiliate-collected payments for the booking must be fully refunded.

        * Cancellations are allowed up until the start time. However, if the booking is cancelled less than 48 hours prior to start time, there is no refund.

        * The requesting user must have permission to cancel bookings (granted on a per-company basis).'
  /companies/<shortname>/bookings/<Booking.uuid>/note/:
