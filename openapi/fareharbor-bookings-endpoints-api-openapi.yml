                - aed
                - aud
                - bgn
                - brl
                - cad
                - chf
                - czk
                - dkk
                - eur
                - gbp
                - hkd
                - huf
                - mxn
                - nok
                - nzd
                - pln
                - ron
                - sek
                - sgd
                - usd
