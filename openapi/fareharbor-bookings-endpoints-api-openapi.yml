            '
        name: shortname
        in: path
        required: true
        description: '

          A unique FareHarbor name assigned to each company when their Dashboard is created, used to access the company''s specific information.

          '
      - schema:
          type: string
          format: uuid
          example: 'd75102be-9732-4523-90a8-c698eff2b983

            '
        name: Booking.uuid
        in: path
        required: true
        description: '

          The UUID that was generated when you first created the booking.

          '
      responses:
        '200':
          description: '

            Returns the `Booking` object, with the note field updated.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: Used to update the booking note by issuing a `PUT` request with the new note; to clear the booking note, pass "".
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BOOKING_NOTE_REQUEST_JSON_SCHEMA'
  /companies/<shortname>/bookings/<Booking.uuid>/customer-custom-field-values/<custom_field_value.pk>/:
