      operationId: put-update-customer-custom-field-value
      deprecated: false
      tags:
      - Bookings Endpoints
      parameters:
      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      - schema:
          type: string
          example: 'hawaiianadventures

            '
        name: shortname
        in: path
        required: true
        description: '

          The shortname of the company.

          '
      - schema:
          type: string
          format: uuid
          example: 'd75102be-9732-4523-90a8-c698eff2b983

            '
        name: Booking.uuid
        in: path
        required: true
        description: '

          The UUID of the Booking.

          '
      - schema:
          type: integer
          example: '12345

            '
        name: custom_field_value.pk
        in: path
        required: true
        description: '

          The id of the customer custom field value.

          '
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CUSTOMER_CUSTOM_FIELD_VALUE_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: ''
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CUSTOMER_CUSTOM_FIELD_VALUE_REQUEST_JSON_SCHEMA'
  /companies/<shortname>/bookings/<Booking.uuid>/resource-uses/<resource_use.pk>/:
    patch:
      summary: Update Resource Use
      operationId: patch-update-resource-use
      deprecated: false
      tags:
      - Bookings Endpoints
      parameters:
      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      - schema:
          type: string
          example: 'hawaiianadventures

            '
        name: shortname
        in: path
        required: true
        description: '

          A unique FareHarbor name assigned to each company when their Dashboard is created, used to access the company''s specific information.

          '
      - schema:
          type: string
          format: uuid
          example: 'd75102be-9732-4523-90a8-c698eff2b983

            '
        name: Booking.uuid
        in: path
        required: true
        description: '

          The UUID that was generated when you first created the booking.

          '
      - schema:
          type: integer
          example: '12345

            '
        name: resource_use.pk
        in: path
        required: true
        description: '

          The id of the existing resource use to update.

          '
      responses:
        '200':
