              type: number
            percentage:
              description: 'When modifier_type is adjust: a number between -100 and 100 inclusive. When modifier_type is set: a number between 0 and 100 inclusive. Only applicable when modifier_kind is percentage.'
              example: 35
              type: number
            pk:
              description: The custom field's unique ID.
              example: 4502
              format: int32
              type: number
            tags:
              items:
                $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/tag'
              type: array
            title:
              type: string
            total:
