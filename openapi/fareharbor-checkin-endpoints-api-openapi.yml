openapi: 3.2.0
info:
  title: FareHarbor Integration Center Checkin Endpoints API
  version: '1.0'
  contact:
    email: support@fareharbor.com
    name: FareHarbor
    url: https://help.fareharbor.com/hc/
  description: The check-in endpoints in the FareHarbor API provide essential capabilities for managing the check-in processes efficiently and seamlessly.
servers:
- url: https://fareharbor.com/api/external/v1
  description: production
- url: https://demo.fareharbor.com/api/external/v1
  description: demo
tags:
- name: Checkin Endpoints
  description: The check-in endpoints in the FareHarbor API provide essential capabilities for managing the check-in processes efficiently and seamlessly.
paths:
  /companies/<shortname>/checkin/:
    put:
      summary: Checkin Qr Code
      operationId: put-checkin-qr-code
      deprecated: false
      tags:
      - Checkin Endpoints
      parameters:
      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      - schema:
          type: string
          example: 'hawaiianadventures

            '
        name: shortname
        in: path
        required: true
        description: '

          A unique FareHarbor name assigned to each company when their Dashboard is created, used to access the company''s specific information.

          '
      responses:
        '200':
          description: "\nReturns a `Booking` object with the customers status updated to reflect that they are checked in. \n\nWhen \"auto\" check-in is used in the request, an HTTP 400 will be returned if the customer (or, in the case of whole booking checkin, any customer) is already checked in.\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: Used to check in a booking based on QR code.
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CHECKIN_QR_CODE_REQUEST_JSON_SCHEMA'
  /companies/<company-shortname>/checkin-statuses/:
    get:
      summary: Checkin Statuses
      operationId: get-checkin-statuses
      deprecated: false
      tags:
      - Checkin Endpoints
      parameters:
      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      - schema:
          type: string
          example: 'hawaiianadventures

            '
        name: company-shortname
        in: path
        required: true
        description: '

          A unique FareHarbor name assigned to each company when their Dashboard is created, used to access the company''s specific information.

          '
      responses:
        '200':
          description: '

            Returns an array of `CheckinStatus` objects for the `Company`. Note that checkin statuses are unique per company.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CHECKIN_STATUSES_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: Used to pull a list of available checkin statuses by specifying it directly via pk instead of having to automatically select the checkin status.
  /companies/<shortname>/bookings/<Booking.uuid>/checkin/:
    put:
      summary: Checkin Booking
      operationId: put-checkin-booking
      deprecated: false
      tags:
      - Checkin Endpoints
      parameters:
      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      - schema:
          type: string
          example: 'hawaiianadventures

            '
        name: shortname
        in: path
        required: true
        description: '

          A unique FareHarbor name assigned to each company when their Dashboard is created, used to access the company''s specific information.

          '
      - schema:
          type: string
          format: uuid
          example: 'd75102be-9732-4523-90a8-c698eff2b983

            '
        name: Booking.uuid
        in: path
        required: true
        description: '

          The UUID that was generated when you first created the booking.

          '
      responses:
        '200':
          description: '

            Returns a `Booking` object with the customers status updated to reflect that they are checked in.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: Used to check in a booking based on the booking UUID.
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CHECKIN_BOOKING_REQUEST_JSON_SCHEMA'
components:
  schemas:
    BOOKING_RESPONSE_JSON_SCHEMA:
      $schema: http://json-schema.org/draft-04/schema#
      additionalProperties: false
      definitions:
        address:
          additionalProperties: false
          properties:
            city:
              example: Honolulu
              type: string
            country:
              example: US
              type: string
            postal_code:
              example: '96821'
              type: string
            province:
              example: HI
              type: string
            street:
              example: 123 Wailupe Cir
              type: string
          required:
          - city
          - country
          - postal_code
          - province
          - street
          type: object
        affiliate_company:
          oneOf:
          - additionalProperties: false
            properties:
              currency:
                description: The company's currency.
                enum:
                - aed
                - aud
                - bgn
                - brl
                - cad
                - chf
                - czk
                - dkk
                - eur
                - gbp
                - hkd
                - huf
                - mxn
                - nok
                - nzd
                - pln
                - ron
                - sek
                - sgd
                - usd
                example: usd
                type: string
              name:
                description: The affiliate companies name.
                example: Affiliate Company
                type: string
              shortname:
                description: A unique FareHarbor name assigned to each company when their Dashboard is created, used to access the company's specific information.
                example: affiliate_company
                type: string
            required:
            - shortname
            - name
            - currency
            type: object
          - description: ''
            type: 'null'
        affiliate_metadata:
          description: Metadata from affiliate sources.
          properties:
            airbnb:
              $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/airbnb_metadata'
          type: object
        affiliation:
          additionalProperties: false
          properties:
            affiliate_company:
              $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/affiliate_company'
          required:
          - affiliate_company
          type: object
        agent:
          oneOf:
          - additionalProperties: false
            properties:
              name:
                description: The agent's name.
                example: Eddie
                type: string
              pk:
                description: The agent's unique ID.
                example: 2314
                format: int32
                type: number
            required:
            - pk
            - name
            type: object
          - description: ''
            type: 'null'
        airbnb_guest_profile:
          description: An Airbnb guest profile.
          properties:
            direct_thread_id:
              description: The direct thread ID for the guest.
              example: '2164961599'
              type:
              - string
              - 'null'
            user_id:
              description: The Airbnb user ID.
              example: '17780410'
              type:
              - string
              - 'null'
          type: object
        airbnb_metadata:
          description: Metadata from Airbnb bookings.
          properties:
            activity_id:
              description: The Airbnb activity ID.
              example: '6137649'
              type:
              - string
              - 'null'
            channel_thread_id:
              description: The Airbnb channel thread ID.
              example: '2199079188'
              type:
              - string
              - 'null'
            guest_id:
              description: The Airbnb guest ID.
              example: '17780410'
              type:
              - string
              - 'null'
            guest_profiles:
              description: List of Airbnb guest profiles.
              items:
                $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/airbnb_guest_profile'
              type:
              - array
              - 'null'
            host_id:
              description: The Airbnb host ID.
              example: '1234'
              type:
              - string
              - 'null'
            offering_id:
              description: The Airbnb offering ID.
              example: '5495433'
              type:
              - string
              - 'null'
          type: object
        arrival:
          oneOf:
          - additionalProperties: false
            properties:
              display_text:
                description: A formatted string that can be shown to customers.
                example: Please arrive by 12:15 pm
                type: string
              notes:
                description: Notes from the activity company regarding arrival (e.g. check-in location details, driving directions); may not be provided.
                example: 'Check-in Time is at 12:15 for your 12:45 Zipline adventure time. Our check-in locations is at our KapohoKine Adventures Store: 224 Kamehameha Ave Suite 106 Hilo, HI 96720'
                format: markdown
                type: string
              notes_safe_html:
                example: 'Check-in Time is at 12:15 for your 12:45 Zipline adventure time. Our check-in locations is at our KapohoKine Adventures Store: 224 Kamehameha Ave Suite 106 Hilo, HI 96720'
                format: markdown
                type: string
              time:
                description: The arrival time (set in the company's local time); the customer must provide their own transporation and arrive at the activity location by this time.
                example: 2024-04-11T13:15:00-1000
                format: datetime
                type: string
            required:
            - time
            - notes
            - notes_safe_html
            - display_text
            type: object
          - description: ''
            type: 'null'
        availability:
          additionalProperties: false
          properties:
            capacity:
              description: The overall maximum number of customers that can currently book this availability; this number will change over time as other customers book.
              example: 3
              type: number
            crew_members:
              items:
                $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/crew_member'
              type: array
            custom_field_instances:
              items:
                $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/custom_field_instance'
              type: array
            customer_type_rates:
              items:
                $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/customer_type_rate'
              type: array
            effective_cancellation_policy:
              $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/effective_cancellation_policy'
            end_at:
              description: The availability's end time (set in the company's local time); note that this time can be arbitrarily long or short, and that start_at can equal end_at for 'point' availabilities.
              example: 2023-08-18T03:30:00-0600
              format: datetime
              type: string
            headline:
              description: The availability's headline.
              example: Epic Jet Ski Tour
              type: string
            item:
              $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/item'
            maximum_party_size:
              oneOf:
              - example: 1
                type: number
              - type: 'null'
            minimum_party_size:
              oneOf:
              - example: 1
                type: number
              - type: 'null'
            online_booking_status:
              description: The availability's status.
              enum:
              - auto
              - open
              - call
              - closed
              - cancelled
              example: auto
              type: string
            pk:
              description: The availabilities's unique ID.
              example: 50291151
              format: int32
              type: number
            start_at:
              description: The availability's start time (set in the company's local time); note that this time can be arbitrarily long or short, and that start_at can equal end_at for 'point' availabilities.
              example: 2023-08-18T00:30:00-0600
              format: datetime
              type: string
          required:
          - pk
          - start_at
          - end_at
          - capacity
          - minimum_party_size
          - maximum_party_size
          - online_booking_status
          - headline
          - item
          - customer_type_rates
          - custom_field_instances
          type: object
        booking:
          additionalProperties: false
          properties:
            affiliate_company:
              $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/affiliate_company'
            affiliate_metadata:
              $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/affiliate_metadata'
            agent:
              $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/agent'
            amount_paid:
              oneOf:
              - type: number
              - type: 'null'
            amount_paid_display:
              oneOf:
              - example: '0.0'
                type: string
              - type: 'null'
            arrival:
              $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/arrival'
            availability:
              $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/availability'
              description: The availability to which this booking corresponds.
            booked_by:
              oneOf:
              - type: 'null'
              - additionalProperties: false
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
            company:
              $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/company'
            confirmation_url:
              description: The booking's confirmation page URL.
              format: uri
              type: string
            contact:
              $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/contact'
              description: Contact information for this booking.
            created_at:
              description: The date and time at which the booking was created (set in utc time).
              example: 2024-06-20T17:14:33+0000
              format: datetime
              type: string
            custom_field_values:
              items:
                $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/custom_field_value'
              type: array
            customer_count:
              description: The number of customers on this booking.
              example: 1
              type: number
            customers:
              description: A list of customers on this booking.
              items:
                $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/customer'
              type: array
            dashboard_url:
              description: The booking's dashboard URL.
              example: https://fareharbor.com/hawaiianadventures/dashboard/?overlay=/contacts/7/bookings/d75102be-9732-4523-90a8-c698eff2b983/
              format: uri
              type: string
            desk:
              $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/desk'
            display_id:
              example: '#6876876'
              type: string
            effective_cancellation_policy:
              $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/effective_cancellation_policy'
            external_id:
              description: An additional identifier if necessary.
              maxLength: 128
              type: string
            generated_codes:
              items:
                $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/generated_code'
              type: array
            invoice_price:
              oneOf:
              - description: The invoice price of this booking. Assuming that the user of the API is a reseller this will be the amount that the user of the API owes the vendor on this booking, if the vendor has opted to set up that information; otherwise it will be null.
                type: number
              - type: 'null'
            invoice_price_display:
              oneOf:
              - type: string
              - type: 'null'
            is_eligible_for_cancellation:
              example: true
              type: boolean
            is_follow_up_email_disabled:
              type: boolean
            is_reminder_email_disabled:
              type: boolean
            is_subscribed_for_sms_updates:
              description: Whether or not the contact would like the booking company to send them SMS updates about this booking. Note that the value of this field does not reflect whether or not the user has sent a STOP request to FareHarbor. If the user sends a STOP request to an External API client, that API client should respect that request.
              example: false
              type: boolean
            line_items:
              description: Line items on the booking.
              items:
                $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/line_item'
              type: array
            lodging:
              oneOf:
              - additionalProperties: false
                properties:
                  name:
                    description: The lodging's name.
                    example: Eddie
                    type: string
                  pk:
                    description: The lodging's unique ID.
                    example: 2314
                    format: int32
                    type: number
                required:
                - pk
                - name
                type: object
              - description: ''
                type: 'null'
            note:
              example: ''
              format: markdown
              type: string
            note_safe_html:
              example: ''
              format: markdown
              type: string
            online_booking_references:
              example: ''
              type: string
            order:
              description: When there is no order associated with the booking, order will be null.
              oneOf:
              - properties:
                  display_id:
                    description: A unique identifier for the order
                    example: ABTT
                    type: string
                type: object
              - description: ''
                type: 'null'
            pickup:
              $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/pickup'
            pk:
              description: The booking's unique ID.
              example: 6876876
              format: int32
              type: number
            rebooked_from:
              oneOf:
              - description: See [Rebooking](#tag/Rebooking)
                example: d75102be-9732-4523-90a8-c698eff2b983
                type: string
              - type: 'null'
            rebooked_to:
              oneOf:
              - description: See [Rebooking](#tag/Rebooking)
                example: 10414711-3d20-4f4d-8ab3-eeaea26c2be3
                type: string
              - type: 'null'
            receipt_subtotal:
              oneOf:
              - example: 36000
                type: number
              - type: 'null'
            receipt_subtotal_display:
              oneOf:
              - example: '360.00'
                type: string
              - type: 'null'
            receipt_taxes:
              oneOf:
              - example: 2776
                type: number
              - type: 'null'
            receipt_taxes_display:
              oneOf:
              - example: '27.76'
                type: string
              - type: 'null'
            receipt_total:
              oneOf:
              - example: 38776
                type: number
              - type: 'null'
            receipt_total_display:
              oneOf:
              - example: '387.76'
                type: string
              - type: 'null'
            related_bookings:
              properties:
                related_order:
                  properties:
                    bookings:
                      description: Booking UUIDs related to the order
                      example:
                      - d75102be-9732-4523-90a8-c698eff2b983
                      - a99e711d-2c70-48ce-87ff-0818942c3489
                      items:
                        type: string
                      type: array
                    id:
                      description: Order ID
                      example: ABTT
                      type: string
                  type: object
              type: object
            source_type:
              enum:
              - online
              - direct
              - pos
              - reseller
              - external-api
              - kiosk
              - imported
              - unkown
              example: online
              type: string
            status:
              enum:
              - booked
              - cancelled
              - rebooked
              example: booked
              type: string
            uuid:
              description: The booking's universally unique identifier; used to access the booking via the API.
              example: d75102be-9732-4523-90a8-c698eff2b983
              format: uuid
              type: string
            voucher_number:
              example: ''
              type: string
            waiver_signatures:
              $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/waiver_signatures'
          required:
          - pk
          - uuid
          - availability
          - contact
          - company
          - affiliate_company
          - customers
          - invoice_price
          - invoice_price_display
          - display_id
          - external_id
          - order
          - status
          - rebooked_from
          - rebooked_to
          - confirmation_url
          - voucher_number
          - online_booking_references
          - receipt_subtotal
          - receipt_subtotal_display
          - receipt_taxes
          - receipt_taxes_display
          - receipt_total
          - receipt_total_display
          - amount_paid
          - amount_paid_display
          - custom_field_values
          - note
          - note_safe_html
          - pickup
          - arrival
          - effective_cancellation_policy
          - is_eligible_for_cancellation
          - agent
          - desk
          - dashboard_url
          - customer_count
          - is_subscribed_for_sms_updates
          - is_follow_up_email_disabled
          - is_reminder_email_disabled
          - created_at
          - source_type
          - booked_by
          - generated_codes
          - waiver_signatures
          - line_items
          - lodging
          - related_bookings
          type: object
        campaign:
          additionalProperties: false
          properties:
            created_at:
              description: The date and time the campaign was created at (set in utc time).
              example: 2023-08-18T00:30:00+0000
              format: datetime
              type: string
            is_archived:
              example: false
              type: boolean
            name:
              example: August Discounts
              type: string
            prefix:
              example: FH
              type: string
            summary:
              type: string
          required:
          - created_at
          - is_archived
          type: object
        checkin_status:
          additionalProperties: false
          properties:
            name:
              description: The checkin status' name.
              example: checked in
              type: string
            pk:
              example: 10
              format: int32
              type: number
            type:
              type: string
          required:
          - pk
          - name
          - type
          type: object
        company:
          additionalProperties: false
          properties:
            currency:
              description: The company's currency.
              enum:
              - aed
              - aud
              - bgn
              - brl
              - cad
              - chf
              - czk
              - dkk
              - eur
              - gbp
              - hkd
              - huf
              - mxn
              - nok
              - nzd
              - pln
              - ron
              - sek
              - sgd
              - usd
              example: usd
              type: string
            name:
              description: The company's name.
              example: Hawaiian Adventures
              type: string
            shortname:
              description: A unique FareHarbor name assigned to each company when their Dashboard is created, used to access the company's specific information.
              example: hawaiianadventures
              type: string
          required:
          - shortname
          - name
          - currency
          type: object
        contact:
          additionalProperties: false
          properties:
            email:
              description: The contact email for the party.
              example: surfer@dude.com
              format: email
              type: string
            is_subscribed_for_email_updates:
              description: Whether or not the contact would like email updates.
              example: false
              type: boolean
            language:
              description: The contact language.
              example: en-us
              type: string
            member:
              oneOf:
              - $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/member'
              - type: 'null'
            name:
              description: The name of the head of the party.
              example: Surfer Dude
              type: string
            normalized_phone:
              description: The party's contact phone number. This will have a plus sign, the country code, and no extra characters such as commas or dashes.
              example: '+14432221100'
              type: string
            phone:
              description: The contact phone number for the party.
              example: +1-443-222-1100
              type: string
            phone_country:
              oneOf:
              - description: The contact phone's country code.
                example: US
                type: string
              - type: 'null'
          required:
          - name
          - phone
          - phone_country
          - normalized_phone
          - email
          - is_subscribed_for_email_updates
          type: object
        crew_member:
          additionalProperties: false
          properties:
            note:
              description: A note on the crew member.
              type: string
            pk:
              description: The crew member's unique ID.
              format: int32
              type: number
            role:
              $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/role'
              description: The role of the crew member.
            user:
