            name:
              example: Default Zone
              type: string
            pk:
              description: The seat zone's unique ID.
              example: 5550
              format: int32
              type: number
          required:
          - pk
          - name
          type: object
        smartwaiver_signatures:
          description: A list of Smartwaiver signatures with details.
          items:
            properties:
              dob_at:
                example: '1991-07-08'
                type: string
              email:
                example: johnsmith@example.com
                format: email
                type: string
              is_age_verified:
                description: Whether the person's age that is signing the waiver is verified.
                example: true
                type: boolean
              name:
                example: John Smith
                type: string
            required:
            - email
            - name
            - is_age_verified
            - dob_at
            type: object
          type: array
        tag:
          additionalProperties: false
          properties:
            name:
              description: The tag's display name.
              example: Outdoor adventure
              type: string
            shortname:
              description: The tag's short name. The short name is unique per company and is limited to lowercase letters (a-z), digits (0-9), and the dash character.
              example: outdoor
              type: string
          required:
          - name
          type: object
        total_cost:
          description: The total_cost will be included only if the permission View amounts is enabled, otherwise it will be null.
          oneOf:
          - properties:
              feeable:
                description: The portion of the price the is subject to fees.
                example: 20000
                type: number
              price:
                oneOf:
                - description: The line item price.
                  example: 20000
                  type: number
                - type: 'null'
              tax:
                description: The tax price.
                type: number
              tax_by_type:
                description: A breakdown of taxes by tax type.
                type: object
              taxable:
                description: The portion of the price that is subject to taxes.
                type: number
              total:
                description: The total cost after taxes and fees.
                example: 20000
                type: number
            type: object
          - description: ''
            type: 'null'
        user:
          additionalProperties: false
          properties:
            name:
              description: The name of the user.
              type: string
            username:
              description: The username of the user.
              type: string
          required:
          - name
          - username
          type: object
        waiver_signatures:
          properties:
            fareharbor:
              $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/fh_waiver_signatures'
            smartwaiver:
              $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/smartwaiver_signatures'
            wherewolf:
              $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/wherewolf_waiver_signatures'
          type: object
        wherewolf_waiver_signatures:
          description: A list of Wherewolf waivers signatures with details.
          items:
            properties:
              dob_at:
                example: '1991-07-08'
                type: string
              email:
                example: johnsmith@example.com
                format: email
                type: string
              is_age_verified:
                description: Whether the person's age that is signing the waiver is verified.
                example: true
                type: boolean
              name:
                example: John Smith
                type: string
              wherewolf_participant_status:
                oneOf:
                - enum:
                  - Checked In
                  - Active
                  - Finalised
                  - Deleted
                  - Ineligible
                  - Started
                  - Loaded
                  - Blank
                  - Incomplete
                  - No-Show
                  example: Checked In
                  type: string
                - description: ''
                  type: 'null'
            required:
            - email
            - name
            - is_age_verified
            - dob_at
            - wherewolf_participant_status
            type: object
          type: array
      properties:
        booking:
          $ref: '#/components/schemas/BOOKING_RESPONSE_JSON_SCHEMA/definitions/booking'
      required:
      - booking
      type: object
    Codes403:
      type: string
      enum:
      - app-invalid
      - app-key-invalid
      - invalid-checkin-permissions-error
      - orderize-booking-uuid-invalid-error
      - user-key-invalid
    CHECKIN_STATUSES_RESPONSE_JSON_SCHEMA:
      $schema: http://json-schema.org/draft-04/schema#
      additionalProperties: false
      definitions:
        checkin-status:
          additionalProperties: false
          description: The customer's checkin status. When there is no checkin status associated with the customer, checkin_status will be null.
          properties:
            name:
              description: The checkin status' name.
              example: checked in
              type: string
            pk:
              example: 10
              format: int32
              type: number
            type:
              example: checked-in
              type: string
          required:
          - pk
          - name
          - type
          type: object
      properties:
        checkin_statuses:
          items:
            $ref: '#/components/schemas/CHECKIN_STATUSES_RESPONSE_JSON_SCHEMA/definitions/checkin-status'
          type: array
      required:
      - checkin_statuses
      type: object
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    CHECKIN_BOOKING_REQUEST_JSON_SCHEMA:
      $schema: http://json-schema.org/draft-04/schema#
      additionalProperties: false
      properties:
        checkin_status:
          oneOf:
          - description: the string 'auto' indicates that checkin status should be automatically determined. The string 'unchanged' will leave the checkin status unchanged. Other string values may be supported in the future. When a checkin status pk is provided, the associated checkin status will be used. When null is provided, the checkin status will be reset. Defaults to 'auto' if the property is not provided.
            example: auto
            type: string
          - type: number
          - type: 'null'
        customer:
          oneOf:
          - description: when a customer pk is specified, the associated customer will be checked in. When null is specified, all customers associated with the booking will be checked in. Defaults to null if the property is not provided.
            example: 2481
            type: number
          - type: 'null'
      type: object
    Codes400:
      type: string
      enum:
      - availability-date-range-invalid
      - book-data-parse-error
      - book-data-validation-error
      - bookability-error
      - booking-cancellation-error
      - booking-creation-error
      - booking-custom-field-value-creation-error
      - booking-custom-field-values-invalid
      - booking-note-error
      - contact-error
      - content-type-invalid-error
      - customer-custom-field-value-creation-error
      - customer-custom-field-value-update-error
      - customer-custom-field-values-invalid
      - customer-type-rates-invalid
      - invalid-checkin-already-checked-in
      - invalid-checkin-customer
      - invalid-checkin-status-error
      - invalid-qr-code-error
      - key-missing
      - lodging-pk-invalid
      - no-default-checkin-status-error
      - orderize-booking-uuid-invalid-error
      - payment-error
      - rebooking-uuid-invalid-error
      - resource-bookability-error
      - voucher-number-invalid
      - voucher-number-not-specified
    Error400:
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          code:
            $ref: '#/components/schemas/Codes400'
    Error403:
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          code:
            $ref: '#/components/schemas/Codes403'
    Error404:
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          code:
            $ref: '#/components/schemas/Codes404'
    Codes404:
      type: string
      enum:
      - availability-pk-invalid
      - booking-uuid-invalid
      - company-shortname-invald
      - customer-custom-field-value-pk-invalid
      - item-pk-invalid
    CHECKIN_QR_CODE_REQUEST_JSON_SCHEMA:
      $schema: http://json-schema.org/draft-04/schema#
      additionalProperties: false
      properties:
        checkin_status:
          oneOf:
          - description: the string 'auto' indicates that checkin status should be automatically determined. The string 'unchanged' will leave the checkin status unchanged. Other string values may be supported in the future. When a checkin status pk is provided, the associated checkin status will be used. When null is provided, the checkin status will be reset. Defaults to 'auto' if the property is not provided.
            example: auto
            type: string
          - type: number
          - type: 'null'
        is_whole_booking:
          description: Whether whole booking checkin is desired. If true, the checkin status for all customers associated with the booking will be updated. If false, the checkin status for the customer associated with the QR code (customer checkin URL) will be updated. Defaults to false if the property is not provided.
          type: boolean
        qr_code:
          description: the customer's QR code data.
          example: https://fhchk.co/abc
          format: uri
          type: string
      required:
      - qr_code
      - is_whole_booking
      type: object
  responses:
    Forbidden:
      description: Forbidden (see [Error Codes](#tag/Error-Codes))
