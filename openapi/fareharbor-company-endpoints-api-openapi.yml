openapi: 3.2.0
info:
  title: FareHarbor Integration Center Company Endpoints API
  version: '1.0'
  contact:
    email: support@fareharbor.com
    name: FareHarbor
    url: https://help.fareharbor.com/hc/
  description: The Company endpoints in the FareHarbor API provide robust functionalities for accessing and managing information related to companies that offer tours and activities.
servers:
- url: https://fareharbor.com/api/external/v1
  description: production
- url: https://demo.fareharbor.com/api/external/v1
  description: demo
tags:
- name: Company Endpoints
  description: The Company endpoints in the FareHarbor API provide robust functionalities for accessing and managing information related to companies that offer tours and activities.
paths:
  /companies/\Z:
    get:
      summary: Companies
      operationId: get-companies
      deprecated: false
      tags:
      - Company Endpoints
      parameters:
      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      responses:
        '200':
          description: '

            Returns an array of `Company` objects.


            Returns a list of all companies for which you have permission to create bookings; note that this may include companies that have no bookable availabilities.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/COMPANIES_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: 'The `/companies` endpoint lists every FareHarbor supplier that an API Partner can access and book through the API. The companies on this list are determined by which suppliers have requested the enablement of the API access for the given API Partner on their dashboard.


        When this request is successful, the API partner will receive a response from our system showing all the accessible suppliers alongside the respective company names, shortnames and the currency of their accounts.


        **Things to note:**

        * The value for the “shortname” will always be what is used in the subsequent endpoints in order to access a specific company’s information.

        * If (in the live environment) you do not see a supplier listed on this endpoint, there could be a few reasons why that is. It could be that the supplier has not requested your enablement yet. It could also be that you made the request using one currency user key when the supplier is on a different currency. Lastly, it may be possible that the supplier has been offboarded from FareHarbor and therefore no longer accessible.

        * Routine calls to this endpoint are recommended to refresh the most up to date list of available suppliers. If a company shortname is no longer available, that shortname can be removed from future /items/ and /availabilities/ requests to avoid ongoing errors.'
  /companies/<company-shortname>/:
    get:
      summary: Company
      operationId: get-company
      deprecated: false
      tags:
      - Company Endpoints
      parameters:
      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      - schema:
          type: string
          example: 'hawaiianadventures

            '
        name: company-shortname
        in: path
        required: true
        description: '

          A unique FareHarbor name assigned to each company when their Dashboard is created, used to access the company''s specific information.

          '
      responses:
        '200':
          description: '

            Returns a `Company` object (extended representation).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/COMPANY_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: 'The `/company` endpoint allows the API Partner to specify one supplier company from the list in the `/companies` endpoint and view company-level information configured in the supplier’s FareHarbor general settings, such as company description, health and safety policy, company location, website URL, and more.


        **Things to Note:**

        * API Partners usually use this endpoint to import basic company details during the initial onboarding and to confirm that the company details on their side are accurate.

        * The location field shown here at the company-level is typically the supplier''s primary address, but it is possible that different items sold by the supplier take place at other locations. These locations would be indicated on the /items endpoint.'
components:
  schemas:
    Codes403:
      type: string
      enum:
      - app-invalid
      - app-key-invalid
      - invalid-checkin-permissions-error
      - orderize-booking-uuid-invalid-error
      - user-key-invalid
    COMPANIES_RESPONSE_JSON_SCHEMA:
