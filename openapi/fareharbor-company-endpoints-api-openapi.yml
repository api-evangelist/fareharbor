      additionalProperties: false
      definitions:
        address:
          additionalProperties: false
          properties:
            city:
              example: Honolulu
              type: string
            country:
              example: US
              type: string
            postal_code:
              example: '96821'
              type: string
            province:
              example: HI
              type: string
            street:
              example: 123 Wailupe Cir
              type: string
          required:
          - city
          - country
          - postal_code
          - province
          - street
          type: object
        company:
          additionalProperties: false
          properties:
            affiliated_since:
              description: If the API user’s company is an affiliate, then we will see a timestamp of when the relationship started (set in utc time).
              example: 2020-06-17T15:44:03+0000
              format: datetime
              oneOf:
              - description: If the API user’s company is an affiliate, then we will see a timestamp of when the relationship started (set in utc time).
                example: 2020-06-17T15:44:03+0000
                format: datetime
                type: string
              - type: 'null'
            contact_email:
              description: The company's contact email.
              example: info@hawaiianadventures.com
              type: string
            contact_phone:
              description: The company's contact phone.
              example: +1-808-555-1234
              type: string
            currency:
              description: The company's currency.
              enum:
              - aed
              - aud
              - bgn
              - brl
              - cad
              - chf
              - czk
              - dkk
              - eur
              - gbp
              - hkd
              - huf
              - mxn
              - nok
              - nzd
              - pln
              - ron
              - sek
              - sgd
              - usd
              example: usd
              type: string
            name:
              description: The company's name.
              example: Hawaiian Adventures
              type: string
            primary_location:
              oneOf:
              - $ref: '#/components/schemas/COMPANIES_RESPONSE_JSON_SCHEMA/definitions/location'
              - type: 'null'
            shortname:
              description: A unique FareHarbor name assigned to each company when their Dashboard is created, used to access the company's specific information.
              example: hawaiianadventures
              type: string
          required:
          - shortname
          - name
          - currency
          - affiliated_since
          - primary_location
          - contact_email
          - contact_phone
          type: object
        location:
          additionalProperties: false
          properties:
            address:
              $ref: '#/components/schemas/COMPANIES_RESPONSE_JSON_SCHEMA/definitions/address'
              description: The location's physical address.
            google_place_id:
              description: The location's Google Place ID.
              example: ChIJYZ4srGUSAHwRT1Da4amp3x
              format: uuid
              type: string
            latitude:
              description: The location's latitude.
              oneOf:
              - example: 90
                type: number
              - type: 'null'
            longitude:
              description: The location's longitude.
              oneOf:
              - example: 0
                type: number
              - type: 'null'
            note:
              description: A brief note about this location that can be displayed to end users.
              example: Next to the blue fence.
              format: markdown
              type: string
            note_safe_html:
              description: A brief note about this location that can be displayed to end users.
              example: <p>Next to the blue fence.</p>
              format: markdown
              type: string
            pk:
              description: The location's unique ID.
              example: 234234
              format: int32
              type: number
            tripadvisor_url:
              description: The location's TripAdvisor URL.
              example: https://www.tripadvisor.com/Attraction_Review-g60982-d184886-Reviews-Epic_Jet_Ski_Tour-Honolulu_Oahu_Hawaii.html
              format: uri
              type: string
            type:
              description: The location's type.
              example: primary
              type: string
          required:
          - pk
          - type
          - note
          - note_safe_html
          - address
          - longitude
          - latitude
          - google_place_id
          - tripadvisor_url
          type: object
      properties:
        companies:
          items:
            $ref: '#/components/schemas/COMPANIES_RESPONSE_JSON_SCHEMA/definitions/company'
          type: array
      required:
      - companies
      type: object
