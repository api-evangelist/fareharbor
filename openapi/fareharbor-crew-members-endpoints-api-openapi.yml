openapi: 3.2.0
info:
  title: FareHarbor Integration Center Crew Members Endpoints API
  version: '1.0'
  contact:
    email: support@fareharbor.com
    name: FareHarbor
    url: https://help.fareharbor.com/hc/
  description: The Crew Members endpoints in the FareHarbor API provide comprehensive functionality for managing crew assignments on availabilities.
servers:
- url: https://fareharbor.com/api/external/v1
  description: production
- url: https://demo.fareharbor.com/api/external/v1
  description: demo
tags:
- name: Crew Members Endpoints
  description: The Crew Members endpoints in the FareHarbor API provide comprehensive functionality for managing crew assignments on availabilities.
paths:
  /companies/<shortname>/availabilities/<availability.pk>/crew-members/:
    get:
      summary: Crew Members
      operationId: get-crew-members
      deprecated: false
      tags:
      - Crew Members Endpoints
