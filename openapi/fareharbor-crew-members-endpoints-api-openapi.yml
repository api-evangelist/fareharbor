      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      - schema:
          type: string
          example: 'hawaiianadventures

            '
        name: shortname
        in: path
        required: true
        description: '

          The shortname of the company.

          '
      - schema:
          type: integer
          example: '4787

            '
        name: availability.pk
        in: path
        required: true
        description: '

          The id of the Availability.

          '
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CREW_MEMBERS_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: ''
    post:
      summary: Crew Members
      operationId: post-crew-members
      deprecated: false
      tags:
      - Crew Members Endpoints
      parameters:
      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      - schema:
          type: string
          example: 'hawaiianadventures

            '
        name: shortname
        in: path
        required: true
        description: '

          The shortname of the company.

          '
      - schema:
          type: integer
          example: '4787

            '
        name: availability.pk
        in: path
        required: true
        description: '

          The id of the Availability.

          '
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CREW_MEMBER_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: ''
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CREATE_CREW_MEMBER_REQUEST_JSON_SCHEMA'
  /companies/<shortname>/availabilities/<availability.pk>/crew-members/(?P<crew_member_id>\d+)/:
    patch:
      summary: Crew Member
      operationId: patch-crew-member
      deprecated: false
      tags:
      - Crew Members Endpoints
      parameters:
      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      - schema:
          type: string
          example: 'hawaiianadventures

            '
        name: shortname
        in: path
        required: true
        description: '

          The shortname of the company.

          '
      - schema:
          type: integer
          example: '4787

            '
        name: availability.pk
        in: path
        required: true
        description: '

          The id of the Availability.

          '
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CREW_MEMBER_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: ''
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UPDATE_CREW_MEMBER_REQUEST_JSON_SCHEMA'
    delete:
      summary: Crew Member
      operationId: delete-crew-member
      deprecated: false
      tags:
      - Crew Members Endpoints
      parameters:
      - $ref: '#/components/parameters/X-FareHarbor-API-App'
      - $ref: '#/components/parameters/X-FareHarbor-API-User'
      - schema:
          type: string
          example: 'hawaiianadventures

            '
        name: shortname
        in: path
        required: true
        description: '

          The shortname of the company.

          '
      - schema:
          type: integer
          example: '4787

            '
        name: availability.pk
        in: path
        required: true
        description: '

          The id of the Availability.

          '
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CREW_MEMBER_RESPONSE_JSON_SCHEMA'
        '400':
          $ref: '#/components/responses/BadRequest'
